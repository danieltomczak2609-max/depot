<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depot-Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E141A">
<meta name="robots" content="noindex">
<style>
/* Layout: Cockpit — Kopfzeile mit Depotwert, darunter Reiter (Übersicht · Journal · Analyse); Karten nur für Chart, Tabellen und Dialoge. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#142230; --muted:#5D6A77; --line:#D8DEE5;
  --accent:#2148C0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FA;
  --gain:#0E8459; --gain-soft:#DDF2E8; --loss:#BF3F2B; --loss-soft:#F8E2DD; --warn:#A86A00; --warn-soft:#FBEFD6;
  --c-stock:#2148C0; --c-etf:#14897F; --c-crypto:#D48A0B; --c-commodity:#8C5A2B; --c-index:#7448B8; --c-bond:#4F6378; --c-other:#8A939C;
  --shadow:0 1px 2px rgba(20,34,48,.06),0 4px 16px rgba(20,34,48,.05);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  --f-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2631; --ink:#E5ECF2; --muted:#8E9BA8; --line:#283442;
  --accent:#7D9BFF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
  --gain:#3DC98F; --gain-soft:#14342A; --loss:#FF7C68; --loss-soft:#3A1F1B; --warn:#F0B44C; --warn-soft:#3A2D14;
  --c-stock:#7D9BFF; --c-etf:#3CC2B4; --c-crypto:#F2AE3D; --c-commodity:#C99063; --c-index:#B08CF0; --c-bond:#93A6BA; --c-other:#A6AFB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2631; --ink:#E5ECF2; --muted:#8E9BA8; --line:#283442;
  --accent:#7D9BFF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
  --gain:#3DC98F; --gain-soft:#14342A; --loss:#FF7C68; --loss-soft:#3A1F1B; --warn:#F0B44C; --warn-soft:#3A2D14;
  --c-stock:#7D9BFF; --c-etf:#3CC2B4; --c-crypto:#F2AE3D; --c-commodity:#C99063; --c-index:#B08CF0; --c-bond:#93A6BA; --c-other:#A6AFB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);letter-spacing:-.02em}
.muted{color:var(--muted)}
.pos{color:var(--gain)} .neg{color:var(--loss)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.total{font-family:var(--f-num);font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:-.04em;line-height:1.05}
.subline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600}
.pill.pos{background:var(--gain-soft)} .pill.neg{background:var(--loss-soft)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.picker{position:relative;display:flex;flex-direction:column;gap:6px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:320px;overflow-y:auto}
.results:empty{display:none}
.results .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 12px 4px;background:var(--surface-2)}
.results .msg{padding:10px 12px;color:var(--muted);font-size:13px}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;width:100%}
.res:first-child,.grp+.res{border-top:0}
.res:hover,.res.active{background:var(--accent-soft)}
.res .rn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rm{grid-column:1;font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:-.02em}
.res .rp{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--f-num);font-size:13px}
.res .eur{color:var(--gain);font-weight:700;font-family:var(--f-body);font-size:11px;margin-left:4px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.picked .asset .n{max-width:none}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.share2{display:grid;grid-template-columns:72px auto;gap:3px 8px;align-items:center;justify-content:end}
.share2 .b{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block}
.share2 .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.share2 .b.inv i{background:var(--muted);opacity:.55}
.share2 .num{font-size:12px;text-align:right;min-width:42px}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:7px;border-radius:4px;display:inline-block}
.arange{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:13px}
.dalio-h{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.dalio-h p{margin:0;font-size:14px}
.statrow{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.statrow.small b{font-size:16px}
.big-num{font-family:var(--f-num);font-size:30px;letter-spacing:-.03em;line-height:1.1}
.heat2{border-collapse:separate;border-spacing:3px}
.heat2 td{min-width:46px;height:34px;text-align:center;font-family:var(--f-num);font-size:11px;border-radius:5px;padding:0;border:0}
.heat2 th{font-size:11px;color:var(--muted);font-weight:600;padding:3px;white-space:nowrap;text-transform:none;letter-spacing:0;border:0}
.riskrow,.attr{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.riskrow .lbl,.attr .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riskrow .bars{display:flex;flex-direction:column;gap:2px}
.riskrow .bars i{display:block;height:7px;border-radius:4px}
.riskrow .vals{font-size:12px;text-align:right;line-height:1.35}
.axis-bar{display:grid;grid-template-columns:1fr 1fr;height:12px}
.axis-bar .half{display:flex;align-items:center}
.axis-bar .neg-side{justify-content:flex-end;border-right:1px solid var(--muted)}
.axis-bar i{display:block;height:10px;border-radius:3px}
.divider{height:1px;background:var(--line);margin:8px 0}
body.snap .edit-only{display:none!important}
body:not(.snap) .snap-only{display:none!important}
.lock{max-width:440px;margin:24px auto;width:100%}
.lock-b{display:flex;flex-direction:column;gap:14px;padding:22px}
.lock-b h2{margin:0;font-size:20px}
.lock-b p{margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps a,.body a:not(.btn){color:var(--accent)}
details summary{font-size:14px}
@media (max-width:640px){.wrap{padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 48px max(14px,env(safe-area-inset-left,0px))}.total{font-size:34px}.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- Handy ---------- */
.m-stack{display:flex;flex-direction:column;gap:14px}
#banner:empty{display:none}
body.snap .top .actions{display:none}
.m-chart{padding:12px 0 12px}
.m-chart .chart-head{padding:4px 14px 0}
.m-chart .chart-head .muted{display:none}
.m-chart .chart-head .big{font-size:26px}
.m-chart .chart{padding:0 4px}
.m-modes{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--line)}
.m-modes button{background:none;border:0;padding:6px 0 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.m-modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.m-ranges{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 10px 0}
.m-ranges button{background:none;border:0;border-radius:999px;padding:8px 0;font-weight:700;font-size:13px;color:var(--muted)}
.m-ranges button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-tiles.three{grid-template-columns:repeat(3,1fr)}
.m-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.m-tile .k{font-size:12px;color:var(--muted);font-weight:600}
.m-tile b{font-family:var(--f-num);font-weight:500;font-size:17px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-tile .s{font-size:11px;color:var(--muted);line-height:1.3}
.m-fine{margin:0 2px;font-size:12px;color:var(--muted)}
.m-sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.m-sec-h h2{margin:0;font-size:17px}
.m-alloc{padding:14px}
.m-stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.m-stackbar i{display:block;height:100%;min-width:2px}
.m-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:13px}
.m-legend span{display:flex;align-items:center;gap:7px;min-width:0}
.m-legend span i{width:9px;height:9px;border-radius:3px;flex:none}
.m-legend b{margin-left:auto;font-family:var(--f-num);font-weight:500;font-size:12px}
.m-chips{display:flex;gap:6px;flex-wrap:wrap}
.m-chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.m-chips.scroll::-webkit-scrollbar{display:none}
.m-chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.m-chips.small button{padding:4px 10px;font-size:12px}
.m-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.m-list{display:flex;flex-direction:column;gap:8px}
.m-pos{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;width:100%}
.m-pos:active,.m-tx:active{transform:scale(.99)}
.m-av{grid-row:span 2;align-self:start;display:flex;position:relative}
.m-av::after{content:"";position:absolute;left:-3px;top:4px;bottom:4px;width:3px;border-radius:2px;background:transparent}
.m-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.m-main .n{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-main .t{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-main .t.note{font-style:italic}
.m-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.m-right b{font-family:var(--f-num);font-weight:500;font-size:15px;letter-spacing:-.03em;white-space:nowrap}
.m-right .t{font-size:12px;color:var(--muted)}
.m-pl{font-family:var(--f-num);font-size:12px;white-space:nowrap}
.m-bars{grid-column:2/4;display:grid;grid-template-columns:1fr 74px;gap:4px 10px;align-items:center;margin-top:6px}
.m-bars .bt{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.m-bars .bt i{display:block;height:100%;border-radius:3px}
.m-bars .bt.inv i{background:var(--muted);opacity:.5}
.m-bars .lbl{font-family:var(--f-num);font-size:11px;text-align:right;min-width:62px}
.m-day{font-family:var(--f-num);font-size:11px;text-align:right;white-space:nowrap}
.m-link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:12px;align-self:center}
.m-search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.m-month{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.m-month-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.05em}
.m-month-h span:last-child{font-family:var(--f-num);font-weight:500;text-transform:none;letter-spacing:-.02em}
.m-txs{padding:2px 0;border-radius:16px;overflow:hidden}
.m-tx{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 13px}
.m-tx:first-child{border-top:0}
.m-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.m-ic.buy{background:var(--accent-soft);color:var(--accent)}
.m-ic.sell{background:var(--warn-soft);color:var(--warn)}
.m-ic.dividend{background:var(--gain-soft);color:var(--gain)}
.m-ic.interest{background:color-mix(in srgb,var(--c-etf) 18%,var(--surface));color:var(--c-etf)}
@media (max-width:640px){
  .tabs{position:sticky;top:0;z-index:15;background:var(--bg);margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-left,0px)) 0}
  .tab{flex:1;text-align:center;padding:12px 6px}
  .top{align-items:flex-start}
  .subline{gap:6px 10px}
}
.lg{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(20,34,48,.08)}
.lg img{width:86%;height:86%;object-fit:contain;display:block}
.lg.ini{color:#fff;font-weight:800;font-size:calc(var(--s) * .34);letter-spacing:.02em;box-shadow:none}
.asset-row{display:flex;align-items:center;gap:9px;min-width:0}
#pos-table .asset .n{max-width:210px}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.srcline{font-size:12px;color:var(--muted)}
.pill.flat{background:var(--surface-2);color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);color:var(--surface);border-color:var(--loss)}
kbd{font-family:var(--f-num);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.7}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:14px}
.banner b{color:var(--warn)}

/* Reiter */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* KPI-Leiste */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi .v{font-family:var(--f-num);font-size:17px;font-weight:500;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px 0}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.card-b{padding:12px 16px 16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chart-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:0 16px}
.chart-head .big{font-family:var(--f-num);font-size:22px;letter-spacing:-.03em}
.chart{position:relative;padding:4px 8px 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s}
.chart .tip b{font-family:var(--f-num);font-weight:500}
.axis text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.grid line{stroke:var(--line)}
.empty-chart{padding:48px 16px;text-align:center;color:var(--muted)}

/* Tabellen */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
th.r,td.r{text-align:right}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.asset{display:flex;flex-direction:column;gap:1px;min-width:0}
.asset .n{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.asset .t{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .bar{width:48px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent)}
.stale{color:var(--warn);font-size:11px;font-weight:600}
.age{font-size:11px;color:var(--muted)}
.type{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px}
.type.buy{background:var(--accent-soft);color:var(--accent)}
.type.sell{background:var(--warn-soft);color:var(--warn)}
.type.dividend{background:var(--gain-soft);color:var(--gain)}
.type.interest{background:color-mix(in srgb,var(--c-etf) 18%,var(--surface));color:var(--c-etf)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
.filters input,.filters select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
.filters input{flex:1 1 200px}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* Analyse */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}
.donut-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.donut-wrap svg{width:170px;height:170px;flex:none}
.legend{display:flex;flex-direction:column;gap:8px;flex:1 1 180px;min-width:0}
.legend .li{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;font-size:14px}
.legend .li span:nth-child(3){font-family:var(--f-num);font-size:12px;color:var(--muted)}
.legend .li span:nth-child(4){font-weight:700;min-width:48px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:5px}
.hbar .val{font-family:var(--f-num);font-size:12px;min-width:64px;text-align:right}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .k{font-size:12px;color:var(--muted);font-weight:600}
.metric .v{font-family:var(--f-num);font-size:20px;letter-spacing:-.03em}
.metric .s{font-size:12px;color:var(--muted)}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{padding:2px 4px;border:0;text-transform:none;letter-spacing:0;text-align:center}
.heat td{padding:6px 4px;border:0;text-align:center;border-radius:4px;font-family:var(--f-num);font-size:11px;min-width:44px}
.heat td.y{font-family:var(--f-body);font-weight:700;text-align:left;font-size:12px}
.note{font-size:12px;color:var(--muted);margin:0}
.toplist{display:flex;flex-direction:column;gap:8px}
.toplist .it{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px}

/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;display:flex;flex-direction:column}
.dialog.wide{max-width:760px}
.dialog header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dialog header h3{margin:0;font-size:17px}
.dialog .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--muted)}
.seg-type{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-type button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px;font-weight:700}
.seg-type button[aria-pressed="true"].buy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg-type button[aria-pressed="true"].sell{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.seg-type button[aria-pressed="true"].dividend{background:var(--gain);color:var(--surface);border-color:var(--gain)}
.seg-type button[aria-pressed="true"].interest{background:var(--c-etf);color:var(--surface);border-color:var(--c-etf)}
.newasset{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.newasset .field input,.newasset .field select{background:var(--surface)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.sum .mono{font-size:18px}
.err{color:var(--loss);font-size:13px;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60}
.status-line{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.live{width:7px;height:7px;border-radius:50%;background:var(--gain)}
.live.old{background:var(--warn)}
@media (max-width:640px){.hide-sm{display:none}}
@media (max-width:640px){#pos-table td,#pos-table th{padding:9px 3px}#pos-table th{font-size:10px;letter-spacing:.03em}#pos-table .asset .n{max-width:98px}#pos-table .asset .t{max-width:98px;overflow:hidden;text-overflow:ellipsis}.share2{grid-template-columns:30px auto;gap:3px 4px}.share2 .num{min-width:34px;font-size:11px}#pos-table{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Depotwert</span>
      <div class="total" id="h-total">–</div>

    </div>

    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="overview" aria-selected="true" type="button">Übersicht</button>

    <button class="tab" role="tab" data-view="analysis" aria-selected="false" type="button">Analyse</button>
  </nav>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="modal"></div>
<div id="toast-host"></div>

<script>
(function(){
"use strict";
/* ---------- Konstanten & Helfer ---------- */
const CLS={
  stock:{label:"Aktie",v:"--c-stock"}, etf:{label:"ETF",v:"--c-etf"}, crypto:{label:"Krypto",v:"--c-crypto"},
  commodity:{label:"Rohstoff",v:"--c-commodity"}, index:{label:"Index",v:"--c-index"}, bond:{label:"Anleihe",v:"--c-bond"}, other:{label:"Sonstiges",v:"--c-other"}
};
const TYPE={buy:"Kauf",sell:"Verkauf",dividend:"Dividende",interest:"Zinsen"};
const IS_INCOME=t=>t==="dividend"||t==="interest";
const MONTHS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const nfE=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const nfE0=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nfP=new Intl.NumberFormat("de-DE",{style:"percent",minimumFractionDigits:2,maximumFractionDigits:2,signDisplay:"exceptZero"});
const nfP1=new Intl.NumberFormat("de-DE",{style:"percent",maximumFractionDigits:1});
const nfQ=new Intl.NumberFormat("de-DE",{maximumFractionDigits:8});
function eur(v,sign){ if(v==null||!isFinite(v))return "–"; const s=nfE.format(v); return sign&&v>0?"+"+s:s; }
function eur0(v){ return v==null||!isFinite(v)?"–":nfE0.format(v); }
function pct(v){ return v==null||!isFinite(v)?"–":nfP.format(v); }
function priceFmt(v){ if(v==null||!isFinite(v))return "–"; const d=Math.abs(v)<1?6:Math.abs(v)<10?4:2; return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:d}).format(v); }
function cls(v){ return v>0.0000001?"pos":v<-0.0000001?"neg":""; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sid(sym){ return String(sym).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,200); }
function parseNum(s){ if(typeof s==="number")return s; s=String(s||"").trim().replace(/\s|€/g,""); if(!s)return NaN; if(s.includes(","))s=s.replace(/\./g,"").replace(",","."); return Number(s); }
function localToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dnum(s){ return Math.round(Date.parse(s+"T00:00:00Z")/864e5); }
function dstr(n){ return new Date(n*864e5).toISOString().slice(0,10); }
function fmtDate(s){ if(!s)return "–"; const [y,m,d]=s.split("-"); return d+"."+m+"."+y; }
function fmtDateShort(s){ const [y,m,d]=s.split("-"); return d+"."+m+"."+y.slice(2); }
function ageText(iso){ if(!iso)return ""; const h=(Date.now()-Date.parse(iso))/36e5; if(!isFinite(h))return ""; if(h<1)return "vor "+Math.max(1,Math.round(h*60))+" Min."; if(h<48)return "vor "+Math.round(h)+" Std."; return "vor "+Math.round(h/24)+" Tagen"; }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function clsColor(c){ return "var("+(CLS[c]||CLS.other).v+")"; }

/* ---------- Zustand ---------- */
const S={tx:[],assets:{},quotes:{},loaded:{tx:false,assets:false,quotes:false},err:null,
  view:"overview",range:"MAX",mode:"pct",aRange:"2J",sort:{key:"value",dir:-1},showClosed:false,
  f:{q:"",type:"",broker:"",cls:""}};
let M=null;
S.status={}; S.rev=0;
try{ const v=localStorage.getItem("depot.ui"); if(v){ const o=JSON.parse(v); ["view","range","mode","aRange"].forEach(k=>{ if(o[k])S[k]=o[k]; }); } }catch(e){}
function saveUi(){ try{ localStorage.setItem("depot.ui",JSON.stringify({view:S.view,range:S.range,mode:S.mode,aRange:S.aRange})); }catch(e){} }

/* ---------- Berechnung ---------- */
function compute(){
  const today=localToday();
  const txs=S.tx.filter(t=>t&&t.date&&TYPE[t.type]&&(t.symbol||t.type==="interest")).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  const pos={};
  const P=sym=>pos[sym]||(pos[sym]={symbol:sym,qty:0,cost:0,realized:0,divs:0,fees:0,taxes:0,invested:0,brokers:{},first:null,last:null,n:0});
  let interest=0, intFees=0, intTaxes=0;
  for(const t of txs){
    if(t.type==="interest"){ interest+=(+t.amount||0)-(+t.fee||0)-(+t.tax||0); intFees+=+t.fee||0; intTaxes+=+t.tax||0; continue; }
    const p=P(t.symbol), q=+t.qty||0, pr=+t.price||0, fee=(+t.fee||0)+(+t.tax||0), b=t.broker||"–";
    p.n++; p.first=p.first||t.date; p.last=t.date; p.fees+=+t.fee||0; p.taxes+=+t.tax||0;
    if(t.type==="buy"){ p.qty+=q; p.cost+=q*pr+fee; p.invested+=q*pr+fee; p.brokers[b]=(p.brokers[b]||0)+q; }
    else if(t.type==="sell"){ const avg=p.qty>0?p.cost/p.qty:0; const qq=Math.min(q,p.qty); p.realized+=qq*pr-fee-avg*qq; p.cost-=avg*qq; p.qty-=qq; p.brokers[b]=(p.brokers[b]||0)-qq; if(p.qty<1e-9){p.qty=0;p.cost=0;} }
    else if(t.type==="dividend"){ p.divs+=(+t.amount||0)-fee; }
  }
  // Kurspunkte je Asset
  const pts={};
  for(const sym of Object.keys(pos)){
    const m={};
    const q=S.quotes[sid(sym)];
    let hs=null; if(q&&q.hist) for(const d in q.hist) if(hs==null||d<hs)hs=d;
    for(const t of txs) if(t.symbol===sym&&(t.type==="buy"||t.type==="sell")&&+t.price>0&&m[t.date]==null&&(hs==null||t.date<hs)) m[t.date]=+t.price;
    if(q&&q.hist&&typeof q.hist==="object") for(const [d,v] of Object.entries(q.hist)) if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&+v>0) m[d]=+v;
    if(q&&+q.priceEur>0&&q.asOf){ m[localDateOf(q.asOf)]=+q.priceEur; }
    pts[sym]=Object.entries(m).map(([d,v])=>[dnum(d),v]).sort((a,b)=>a[0]-b[0]);
  }
  // Aktueller Kurs
  let V=0;
  for(const p of Object.values(pos)){
    const q=S.quotes[sid(p.symbol)], arr=pts[p.symbol];
    p.asset=S.assets[sid(p.symbol)]||{ticker:p.symbol,name:p.symbol,cls:"other"};
    p.quote=q||null;
    p.price=q&&+q.priceEur>0?+q.priceEur:(arr&&arr.length?arr[arr.length-1][1]:0);
    p.priceSrc=q&&+q.priceEur>0?(q.source||"Kurs"):"letzte Transaktion";
    p.priceAt=q&&q.asOf?q.asOf:null;
    p.stale=!q||!q.asOf||(Date.now()-Date.parse(q.asOf))>4*864e5;
    p.value=p.qty*p.price; p.avg=p.qty>0?p.cost/p.qty:0;
    p.unreal=p.value-p.cost; p.unrealPct=p.cost>0?p.unreal/p.cost:0;
    p.total=p.unreal+p.realized+p.divs;
    // vorheriger Kurs für Tagesänderung
    if(arr&&arr.length>1){ const prev=arr[arr.length-2][1]; p.chg=p.price/prev-1; } else p.chg=null;
    V+=p.value;
  }
  for(const p of Object.values(pos)) p.share=V>0?p.value/V:0;

  // Tägliche Reihe
  const series={dates:[],value:[],invested:[],flow:[],idx:[],ret:[],profit:[]};
  if(txs.length){
    const d0=dnum(txs[0].date)-1, d1=Math.max(dnum(today),dnum(txs[txs.length-1].date));
    const hold={}, ptr={}; let ti=0, inv=0, idx=1, prevV=0;
    const priceAt=(sym,d)=>{ const a=pts[sym]; if(!a||!a.length)return 0; let i=ptr[sym]||0; while(i<a.length-1&&a[i+1][0]<=d)i++; ptr[sym]=i; if(d<=a[0][0])return a[0][1]; if(i>=a.length-1)return a[a.length-1][1]; const [x0,y0]=a[i],[x1,y1]=a[i+1]; return y0+(y1-y0)*(d-x0)/(x1-x0); };
    for(let d=d0; d<=d1; d++){
      const ds=dstr(d); let flow=0;
      while(ti<txs.length&&txs[ti].date===ds){
        const t=txs[ti++], q=+t.qty||0, pr=+t.price||0, fee=(+t.fee||0)+(+t.tax||0);
        if(t.type==="buy"){ flow+=q*pr+fee; hold[t.symbol]=(hold[t.symbol]||0)+q; }
        else if(t.type==="sell"){ const h=hold[t.symbol]||0, qq=Math.min(q,h); flow-=qq*pr-fee; hold[t.symbol]=h-qq; }
        else if(IS_INCOME(t.type)){ flow-=(+t.amount||0)-fee; }
      }
      let v=0; for(const s in hold) if(hold[s]>1e-12) v+=hold[s]*priceAt(s,d);
      let r=0;
      if(prevV>1e-9) r=(v-flow)/prevV-1; else if(flow>1e-9) r=v/flow-1;
      if(!isFinite(r))r=0;
      idx*=1+r; inv+=flow;
      series.dates.push(ds); series.value.push(v); series.invested.push(inv); series.flow.push(flow); series.idx.push(idx); series.ret.push(r); series.profit.push(v-inv);
      prevV=v;
    }
  }
  const n=series.dates.length;
  const k={value:V,invested:n?series.invested[n-1]:0,profit:n?series.profit[n-1]:0,twr:n?series.idx[n-1]-1:0};
  k.unreal=Object.values(pos).reduce((a,p)=>a+p.unreal,0);
  k.realized=Object.values(pos).reduce((a,p)=>a+p.realized,0);
  k.divs=Object.values(pos).reduce((a,p)=>a+p.divs,0);
  k.fees=Object.values(pos).reduce((a,p)=>a+p.fees,0)+intFees;
  k.interest=interest;
  k.taxes=Object.values(pos).reduce((a,p)=>a+p.taxes,0)+intTaxes;
  k.cost=Object.values(pos).reduce((a,p)=>a+p.cost,0);
  k.day=n>1?(series.value[n-1]-series.value[n-2]-series.flow[n-1]):0;
  k.dayPct=n>1&&series.value[n-2]>0?k.day/series.value[n-2]:0;
  let lastQuote=null; for(const q of Object.values(S.quotes)) if(q&&q.asOf&&(!lastQuote||q.asOf>lastQuote))lastQuote=q.asOf;
  k.lastQuote=lastQuote;
  return {txs,pos,series,k,pts,today};
}
function localDateOf(iso){ const d=new Date(iso); if(isNaN(d))return localToday(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function rangeStart(series,range){
  const n=series.dates.length; if(!n)return 0;
  const last=dnum(series.dates[n-1]); let from;
  if(range==="1M")from=last-30; else if(range==="3M")from=last-91; else if(range==="1J")from=last-365; else if(range==="3J")from=last-1095;
  else if(range==="YTD")from=dnum(series.dates[n-1].slice(0,4)+"-01-01")-1; else return 0;
  const i=from-dnum(series.dates[0]); return Math.max(0,Math.min(n-1,i));
}

function analytics(series){
  const n=series.dates.length, out={};
  if(n<2)return out;
  // Drawdown
  let peak=series.idx[0], peakD=series.dates[0], mdd=0, mddFrom=null, mddTo=null;
  for(let i=0;i<n;i++){ const v=series.idx[i]; if(v>peak){peak=v;peakD=series.dates[i];} const dd=v/peak-1; if(dd<mdd){mdd=dd;mddFrom=peakD;mddTo=series.dates[i];} }
  out.mdd=mdd; out.mddFrom=mddFrom; out.mddTo=mddTo;
  out.curDD=series.idx[n-1]/Math.max(...series.idx)-1;
  // Volatilität (letzte 365 Tage)
  const rs=series.ret.slice(Math.max(1,n-365));
  const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
  const sd=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,rs.length-1));
  out.vol=sd*Math.sqrt(365);
  const years=(n-1)/365.25;
  out.years=years;
  out.cagr=years>=1?Math.pow(series.idx[n-1],1/years)-1:null;
  out.sharpeLike=out.vol>0&&out.cagr!=null?out.cagr/out.vol:null;
  // Monatsrenditen + Monatszuflüsse
  const months={}; let prevIdx=1, prevKey=null;
  const flows={};
  for(let i=0;i<n;i++){
    const key=series.dates[i].slice(0,7);
    if(key!==prevKey){ if(prevKey)months[prevKey].end=series.idx[i-1]; months[key]={start:prevIdx}; prevKey=key; }
    prevIdx=series.idx[i]; flows[key]=(flows[key]||0)+series.flow[i];
  }
  months[prevKey].end=series.idx[n-1];
  out.months={}; for(const [k,v] of Object.entries(months)) out.months[k]=v.end/v.start-1;
  out.flows=flows;
  const mv=Object.entries(out.months);
  if(mv.length){ out.best=mv.reduce((a,b)=>b[1]>a[1]?b:a); out.worst=mv.reduce((a,b)=>b[1]<a[1]?b:a); out.posMonths=mv.filter(m=>m[1]>0).length; out.nMonths=mv.length; }
  return out;
}

/* ---------- Diagramm ---------- */
function niceTicks(min,max,count){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, step0=span/Math.max(1,count), mag=Math.pow(10,Math.floor(Math.log10(step0))), r=step0/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];

function lineChart(host,{dates,lines,fmt,height,zero,tipRows}){
  host.innerHTML="";
  const W=Math.max(280,host.clientWidth-16), H=height||(isMobile()?230:280), padL=8, padR=isMobile()?48:64, padT=12, padB=26;
  const n=dates.length;
  if(n<2){ host.innerHTML='<div class="empty-chart">Noch zu wenige Daten für einen Verlauf.</div>'; return; }
  let mn=Infinity,mx=-Infinity; for(const l of lines) for(const v of l.values){ if(v<mn)mn=v; if(v>mx)mx=v; }
  if(zero){ mn=Math.min(mn,0); mx=Math.max(mx,0); }
  const ticks=niceTicks(mn,mx,4); const y0=ticks[0], y1=ticks[ticks.length-1];
  const X=i=>padL+(W-padL-padR)*i/(n-1), Y=v=>padT+(H-padT-padB)*(1-(v-y0)/(y1-y0||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">`;
  s+='<g class="grid">'+ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"${t===0&&zero?' style="stroke:var(--muted);stroke-dasharray:3 3"':''}/>`).join("")+'</g>';
  s+='<g class="axis">'+ticks.map(t=>`<text x="${W-padR+8}" y="${(Y(t)+4).toFixed(1)}">${esc(fmt(t,true))}</text>`).join("");
  const xt=Math.max(1,Math.min(6,n-1,Math.floor((W-padR)/90)));
  for(let j=0;j<=xt;j++){ const i=Math.round((n-1)*j/xt); const anchor=j===0?"start":j===xt?"end":"middle"; s+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor}">${fmtDateShort(dates[i])}</text>`; }
  s+='</g>';
  lines.forEach((l,li)=>{
    let d=""; l.values.forEach((v,i)=>{ d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); });
    if(l.fill){ const base=Y(Math.max(y0,Math.min(y1,zero?0:y0))); s+=`<path d="${d}L${X(n-1).toFixed(1)} ${base.toFixed(1)}L${X(0).toFixed(1)} ${base.toFixed(1)}Z" fill="${l.color}" fill-opacity=".12" stroke="none"/>`; }
    s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width||2}" stroke-linejoin="round" stroke-linecap="round"${l.dash?' stroke-dasharray="5 4"':''}/>`;
    if(!l.dash){ const v=l.values[n-1]; s+=`<circle cx="${X(n-1).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${l.color}" stroke="var(--surface)" stroke-width="2"/>`; }
  });
  s+=`<line class="cross" x1="0" x2="0" y1="${padT}" y2="${H-padB}" stroke="var(--muted)" stroke-dasharray="2 3" opacity="0"/>`;
  s+=lines.map((l,i)=>`<circle class="hp" data-i="${i}" r="4" fill="${l.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("");
  s+=`<rect x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  host.innerHTML=s;
  const svg=host.querySelector("svg"), tip=host.querySelector(".tip"), cross=svg.querySelector(".cross"), hps=svg.querySelectorAll(".hp");
  const move=e=>{
    const r=svg.getBoundingClientRect(), sx=W/r.width; const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*sx;
    const i=Math.max(0,Math.min(n-1,Math.round((x-padL)/(W-padL-padR)*(n-1))));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",1);
    hps.forEach((c,k)=>{ c.setAttribute("cx",X(i)); c.setAttribute("cy",Y(lines[k].values[i])); c.setAttribute("opacity",1); });
    tip.innerHTML=`<div>${fmtDate(dates[i])}</div>`+(tipRows?tipRows(i):lines.map(l=>`<div>${esc(l.name)}: <b>${esc(fmt(l.values[i]))}</b></div>`).join(""));
    const top=Math.min(...lines.map(l=>Y(l.values[i])));
    tip.style.left=Math.max(70,Math.min(r.width-70,X(i)/sx+8))+"px"; tip.style.top=(top/sx-6)+"px"; tip.style.opacity=1;
  };
  const leave=()=>{ tip.style.opacity=0; cross.setAttribute("opacity",0); hps.forEach(c=>c.setAttribute("opacity",0)); };
  svg.addEventListener("mousemove",move); svg.addEventListener("touchmove",move,{passive:true}); svg.addEventListener("mouseleave",leave); svg.addEventListener("touchend",leave);
}
function donut(items,size){
  const total=items.reduce((a,b)=>a+b.v,0)||1, R=size/2, r=R*0.62; let a=-Math.PI/2, s=`<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  if(items.length===1){ s+=`<circle cx="${R}" cy="${R}" r="${(R+r)/2}" fill="none" stroke="${items[0].c}" stroke-width="${R-r}"/>`; }
  else for(const it of items){ const f=it.v/total; if(f<=0)continue; const a2=a+f*Math.PI*2, large=f>.5?1:0;
    const p=(ang,rad)=>[R+rad*Math.cos(ang),R+rad*Math.sin(ang)].map(v=>v.toFixed(2)).join(" ");
    s+=`<path d="M${p(a,R)}A${R} ${R} 0 ${large} 1 ${p(a2,R)}L${p(a2,r)}A${r} ${r} 0 ${large} 0 ${p(a,r)}Z" fill="${it.c}" stroke="var(--surface)" stroke-width="1.5"/>`; a=a2; }
  return s+"</svg>";
}

/* ---------- Analyse (Quant) ---------- */
const RF=0.02; // Annahme risikofreier Zins p. a. (Tagesgeld)
const A_RANGES=[["1J",365],["2J",730],["3J",1095],["MAX",0]];
function aStartIdx(series){
  const n=series.dates.length; if(!n)return 0;
  const days=(A_RANGES.find(r=>r[0]===S.aRange)||A_RANGES[1])[1];
  if(!days)return 0;
  return Math.max(0,n-1-days);
}
function mean(a){ return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN; }
function sd(a){ if(a.length<2)return NaN; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); }
function cov(a,b){ const ma=mean(a),mb=mean(b); let s=0; for(let i=0;i<a.length;i++)s+=(a[i]-ma)*(b[i]-mb); return s/(a.length-1); }
function corrOf(a,b){ const c=cov(a,b), x=sd(a), y=sd(b); return x&&y?c/(x*y):NaN; }
function quantile(a,q){ const s=a.slice().sort((x,y)=>x-y); if(!s.length)return NaN; const p=(s.length-1)*q, i=Math.floor(p); return s[i]+(s[Math.min(i+1,s.length-1)]-s[i])*(p-i); }
function fmtNum(v,d=2){ return v==null||!isFinite(v)?"–":v.toFixed(d).replace(".",","); }
// Kurs eines Datums aus einer Historie {datum:kurs} (letzter bekannter Wert davor)
function makeLookup(hist){ const ks=Object.keys(hist||{}).sort(); return d=>{ let lo=0,hi=ks.length-1,ans=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(ks[m]<=d){ans=m;lo=m+1;} else hi=m-1; } return ans<0?null:hist[ks[ans]]; }; }
// Wochenrenditen einer Historie, Schlüssel = Datum des Wochenendes (Sonntag)
function weekKey(d){ const t=dnum(d), wd=(new Date(t*864e5).getUTCDay()+6)%7; return dstr(t-wd+6); }
function weeklyFromHist(hist,fromDate){
  const last={}; Object.keys(hist||{}).sort().forEach(d=>{ if(+hist[d]>0) last[weekKey(d)]=+hist[d]; });
  const ks=Object.keys(last).sort(), out={};
  for(let i=1;i<ks.length;i++){ if(ks[i]<fromDate)continue; out[ks[i]]=last[ks[i]]/last[ks[i-1]]-1; }
  return out;
}

function quant(){
  const se=M.series, n=se.dates.length;
  const Q={ok:false}; if(n<15)return Q;
  const s0=aStartIdx(se), from=se.dates[s0];
  Q.from=from; Q.to=se.dates[n-1]; Q.days=n-1-s0;
  // Depot: Wochenrenditen aus dem zeitgewichteten Index
  const pw={}; const lastByWeek={};
  for(let i=s0;i<n;i++){ lastByWeek[weekKey(se.dates[i])]={i,idx:se.idx[i],v:se.value[i]}; }
  const wk=Object.keys(lastByWeek).sort();
  for(let j=1;j<wk.length;j++){ const a=lastByWeek[wk[j-1]], b=lastByWeek[wk[j]]; if(a.v>1) pw[wk[j]]=b.idx/a.idx-1; }
  Q.pw=pw; const pr=Object.values(pw);
  Q.ret=se.idx[n-1]/se.idx[s0]-1;
  const yrs=Q.days/365.25; Q.yrs=yrs;
  Q.ann=yrs>=0.5?Math.pow(1+Q.ret,1/yrs)-1:null;
  Q.vol=pr.length>=8?sd(pr)*Math.sqrt(52):null;
  const rfw=RF/52;
  Q.sharpe=Q.vol?((mean(pr)-rfw)*52)/Q.vol:null;
  const down=Math.sqrt(mean(pr.map(r=>Math.min(0,r-rfw)**2)))*Math.sqrt(52);
  Q.sortino=pr.length>=8&&down>0?((mean(pr)-rfw)*52)/down:null;
  // Drawdown im Zeitraum
  let peak=se.idx[s0], mdd=0, mFrom=from, mTo=from, pk=from; Q.dd=[];
  for(let i=s0;i<n;i++){ if(se.idx[i]>peak){peak=se.idx[i];pk=se.dates[i];} const d=se.idx[i]/peak-1; Q.dd.push(d); if(d<mdd){mdd=d;mFrom=pk;mTo=se.dates[i];} }
  Q.mdd=mdd; Q.mddFrom=mFrom; Q.mddTo=mTo; Q.curDD=Q.dd[Q.dd.length-1];
  let since=n-1; while(since>s0&&Q.dd[since-s0]<-1e-6)since--; Q.ddDays=n-1-since;
  Q.calmar=Q.ann!=null&&mdd<0?Q.ann/Math.abs(mdd):null;
  Q.var95=pr.length>=26?quantile(pr,0.05):null;
  Q.cvar95=Q.var95!=null?mean(pr.filter(r=>r<=Q.var95)):null;
  Q.bestW=pr.length?Math.max(...pr):null; Q.worstW=pr.length?Math.min(...pr):null;
  Q.posW=pr.filter(r=>r>0).length; Q.nW=pr.length;
  // Vergleichsindex
  const bh=S.bench&&S.bench.hist;
  if(bh&&Object.keys(bh).length>20){
    const look=makeLookup(bh); const b0=look(from);
    if(b0){
      Q.benchLine=se.dates.slice(s0).map(d=>{ const v=look(d); return v?v/b0-1:0; });
      Q.bRet=Q.benchLine[Q.benchLine.length-1];
      Q.bAnn=yrs>=0.5?Math.pow(1+Q.bRet,1/yrs)-1:null;
      const bw=weeklyFromHist(bh,from); const common=Object.keys(pw).filter(k=>bw[k]!=null);
      if(common.length>=12){
        const x=common.map(k=>bw[k]), y=common.map(k=>pw[k]);
        Q.beta=cov(y,x)/cov(x,x); Q.corrB=corrOf(y,x);
        Q.alpha=((mean(y)-rfw)-Q.beta*(mean(x)-rfw))*52;
        Q.bVol=sd(x)*Math.sqrt(52);
        Q.te=sd(y.map((v,i)=>v-x[i]))*Math.sqrt(52);
      }
      let bpk=-1e9; Q.bdd=Q.benchLine.map(v=>{ const lvl=1+v; if(lvl>bpk)bpk=lvl; return lvl/bpk-1; });
      Q.bMdd=Math.min(...Q.bdd);
    }
  }
  // Positionen: Wochenrenditen, Korrelation, Risiko
  const open=Object.values(M.pos).filter(p=>p.qty>1e-9).sort((a,b)=>b.value-a.value);
  const W={}; open.forEach(p=>{ const q=S.quotes[p.symbol]; W[p.symbol]=weeklyFromHist(q&&q.hist||{},from); });
  const enough=p=>Object.keys(W[p.symbol]).length>=20;
  Q.open=open; Q.withData=open.filter(enough); Q.noData=open.filter(p=>!enough(p));
  const ids=Q.withData.map(p=>p.symbol);
  const C={}, CV={}, NO={};
  ids.forEach(a=>ids.forEach(b=>{ const ks=Object.keys(W[a]).filter(k=>W[b][k]!=null); NO[a+"|"+b]=ks.length;
    if(ks.length>=20){ const x=ks.map(k=>W[a][k]), y=ks.map(k=>W[b][k]); C[a+"|"+b]=a===b?1:corrOf(x,y); CV[a+"|"+b]=cov(x,y)*52; } }));
  Q.C=C;
  const pairs=[]; ids.forEach((a,i)=>ids.forEach((b,j)=>{ if(i<j&&isFinite(C[a+"|"+b]))pairs.push(C[a+"|"+b]); }));
  Q.rhoAvg=pairs.length?mean(pairs):null; Q.nPairs=pairs.length;
  const N=ids.length;
  Q.nEff=Q.rhoAvg!=null&&N>1?N/(1+(N-1)*Math.max(Q.rhoAvg,-1/(N-1)+1e-9)):null;
  // Risikobeitrag aus Kovarianzmatrix (aktuelle Gewichte)
  const totV=Q.withData.reduce((s,p)=>s+p.value,0);
  if(N>=2&&totV>0){
    const w=Q.withData.map(p=>p.value/totV);
    const Sw=ids.map((a,i)=>ids.reduce((s,b,j)=>s+(CV[a+"|"+b]||0)*w[j],0));
    const varP=w.reduce((s,wi,i)=>s+wi*Sw[i],0);
    Q.pVol=varP>0?Math.sqrt(varP):null;
    Q.risk=Q.withData.map((p,i)=>({p,w:w[i],vol:Math.sqrt(Math.max(0,CV[p.symbol+"|"+p.symbol]||0)),rc:varP>0?w[i]*Sw[i]/varP:null}));
    const sumVol=Q.risk.reduce((s,r)=>s+r.w*r.vol,0); Q.divRatio=Q.pVol?sumVol/Q.pVol:null;
  }
  Q.ok=true; return Q;
}

function svgDalio(N,rho){
  const Wd=560,H=250,pl=44,pr=16,pt=14,pb=36, X=n=>pl+(Wd-pl-pr)*(n-1)/19, Y=v=>pt+(H-pt-pb)*(1-v);

  [0,.25,.5,.75,1].forEach(v=>s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v*100} %</text>`);
  [1,5,10,15,20].forEach(n=>s+=`<text x="${X(n)}" y="${H-16}" text-anchor="middle" font-size="11" fill="var(--muted)">${n}</text>`);
  s+=`<text x="${(Wd+pl)/2}" y="${H-1}" text-anchor="middle" font-size="11" fill="var(--muted)">Anzahl Positionen</text>`;
  [[0,"--gain","unabhängig"],[0.2,"--accent","ρ 0,2"],[0.4,"--c-crypto","ρ 0,4"],[0.6,"--loss","ρ 0,6"]].forEach(([r,c,l])=>{ let d=""; for(let n=1;n<=20;n++)d+=(n>1?"L":"M")+X(n).toFixed(1)+" "+Y(risk(n,r)).toFixed(1); s+=`<path d="${d}" fill="none" stroke="var(${c})" stroke-width="2"/><text x="${X(20)-4}" y="${Y(risk(20,r))-6}" text-anchor="end" font-size="11" fill="var(${c})">${l}</text>`; });
  if(N>=1&&rho!=null){ const n=Math.min(20,N), y0=risk(n,Math.max(0,rho)); s+=`<circle cx="${X(n)}" cy="${Y(y0)}" r="7" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/><text x="${X(n)+(n>14?-12:12)}" y="${Y(y0)-12}" text-anchor="${n>14?"end":"start"}" font-size="12" font-weight="700" fill="var(--ink)">dein Depot</text>`; }
  return s+"</svg>";
}
function svgHist(rets,var95){
  const Wd=560,H=220,pl=36,pr=12,pt=12,pb=30; const lo=-0.2,hi=0.2,step=0.02,nb=Math.round((hi-lo)/step);
  const bins=new Array(nb).fill(0); rets.forEach(r=>{ const i=Math.max(0,Math.min(nb-1,Math.floor((r-lo)/step))); bins[i]++; });
  const mx=Math.max(1,...bins), X=v=>pl+(Wd-pl-pr)*(v-lo)/(hi-lo), Y=c=>pt+(H-pt-pb)*(1-c/mx), bw=(Wd-pl-pr)/nb;
  let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Verteilung der Wochenrenditen">`;
  niceTicks(0,mx,3).filter(t=>t<=mx&&Number.isInteger(t)).forEach(t=>s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`);
  bins.forEach((c,i)=>{ if(!c)return; const x=pl+i*bw, mid=lo+(i+.5)*step; s+=`<rect x="${(x+1).toFixed(1)}" y="${Y(c).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H-pb-Y(c)).toFixed(1)}" rx="2" fill="var(${mid<0?"--loss":"--gain"})" opacity=".8"/>`; });
  [-0.2,-0.1,0,0.1,0.2].forEach(v=>s+=`<text x="${X(v)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${v>0?"+":""}${Math.round(v*100)} %</text>`);
  if(var95!=null&&var95>lo){ const x=X(var95); s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${x-4}" y="${pt+10}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">VaR 95 %</text>`; }
  return s+"</svg>";
}

/* ---------- Server ---------- */
const ISIN_RE=/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/;
async function api(method,path,body){
  let r;
  try{ r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("Die Depot-App läuft nicht. Starte sie mit „Depot starten“."); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||("Fehler "+r.status));
  return j;
}
async function load(){
  try{
    const j=await api("GET","/api/state");
    S.tx=(j.transactions||[]).map(t=>({...t,symbol:t.asset}));
    S.assets=j.assets||{}; S.quotes=j.quotes||{}; S.bench=j.bench||null; S.logos=j.logos||{}; S.status=j.status||{}; S.rev=j.rev; S.offline=false; S.err=null;
  }catch(e){ S.offline=true; S.err="App nicht erreichbar"; }
  S.loaded={tx:true,assets:true,quotes:true};
  schedule(); renderRefreshBtn(); renderFoot();
}
let pollT=0;
async function poll(){
  clearTimeout(pollT);
  try{ const r=await api("GET","/api/rev"); if(S.offline||r.rev!==S.rev||r.running!==!!S.status.running||r.progress!==(S.status.progress||"")) await load(); }
  catch(e){ if(!S.offline){ S.offline=true; schedule(); renderRefreshBtn(); renderFoot(); } }
  pollT=setTimeout(poll,(S.status&&S.status.running)||S.offline?2500:30000);
}
function srcText(a){
  if(!a)return "";
  if(a.ovId) return "Kursquelle: onvista · Börse "+esc(a.exchange||"–")+(a.currency&&a.currency!=="EUR"?" · notiert in "+esc(a.currency)+", umgerechnet mit dem EZB-Kurs":" · in Euro");
  return "Keine Kursquelle. Den Kurs setzt du hier von Hand.";
}
function srcBadge(p,long){
  const q=p.quote||{};

  const t=ageText(p.priceAt)+(long?" · "+esc(p.asset.ovId?(p.asset.exchange||"onvista"):"manuell"):"");

}

/* Asset-Suche: erst im eigenen Depot, dann bei der Kursquelle */
function mountPicker(host,{onPick,placeholder,initial,allowManual,localFirst}){
  host.innerHTML=`<div class="picker"><input id="pk-q" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder||"Ticker, ISIN oder Name, z. B. AAPL, NASDAQ:AAPL, SAP, VWCE, BTC")}" value="${esc(initial||"")}" aria-label="Asset suchen"><div class="results" id="pk-res" role="listbox"></div></div>`;
  const inp=host.querySelector("#pk-q"), res=host.querySelector("#pk-res");
  let items=[], active=0, timer=0, seq=0; const cache={};
  const draw=(remote,loading,error)=>{
    const q=inp.value.trim(), qu=q.toUpperCase(); items=[]; let html="";
    if(!q){ res.innerHTML=""; return; }
    if(localFirst!==false){
      const loc=Object.entries(S.assets).filter(([id,a])=>[a.ticker,a.name,a.isin].some(x=>x&&String(x).toUpperCase().includes(qu))).slice(0,5);
      if(loc.length){ html+='<div class="grp">In deinem Depot</div>'; loc.forEach(([id,a])=>{ items.push({existing:true,id,a}); html+=resBtn(items.length-1,a.name,(a.ticker||"")+(a.exchange?" · "+a.exchange:"")+(a.isin?" · "+a.isin:""),""); }); }
    }
    if(loading) html+='<div class="msg">Suche …</div>';
    else if(error) html+=`<div class="msg">${esc(error)}</div>`;
    else if(remote){
      const fresh=remote.filter(r=>!items.some(it=>it.existing&&String(it.a.ovId)===String(r.ovId)));
      if(fresh.length){ html+='<div class="grp">Gefunden</div>'; fresh.forEach(r=>{ items.push({r}); html+=resBtn(items.length-1,r.name,[r.ticker,r.exchLabel,r.typeLabel||(CLS[r.cls]||CLS.other).label,r.isin].filter(Boolean).join(" · "),r.price!=null?priceNative(r.price,r.currency)+(r.currency==="EUR"?'<span class="eur">EUR</span>':""):""); }); }
      else if(!items.length) html+='<div class="msg">Nichts gefunden. Prüf die Schreibweise oder versuch die ISIN.</div>';
    }
    if(allowManual&&!loading){ items.push({manual:true,text:q}); html+=resBtn(items.length-1,"„"+q+"“ ohne Kursquelle anlegen","Kurs trägst du dann selbst ein",""); }
    res.innerHTML=html; active=0; mark();
    res.querySelectorAll(".res").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  };
  const mark=()=>res.querySelectorAll(".res").forEach(b=>b.classList.toggle("active",+b.dataset.i===active));
  const pick=i=>{ const it=items[i]; if(it)onPick(it); };
  const search=()=>{
    const q=inp.value.trim(); clearTimeout(timer);
    if(!q){ draw(); return; }
    if(cache[q.toUpperCase()]){ draw(cache[q.toUpperCase()]); return; }
    draw(null,true);
    timer=setTimeout(async()=>{
      const my=++seq;
      try{ const j=await api("GET","/api/search?q="+encodeURIComponent(q)); cache[q.toUpperCase()]=j.results||[]; if(my===seq&&inp.value.trim()===q)draw(j.results||[]); }
      catch(e){ if(my===seq)draw(null,false,e.message); }
    },380);
  };
  inp.addEventListener("input",search);
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1,active+1); mark(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); mark(); }
    else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); if(items.length)pick(active); }
  });
  if(initial)search();
  setTimeout(()=>inp.focus(),30);
}
function resBtn(i,name,meta,price){ return `<button type="button" class="res" data-i="${i}" role="option"><span class="rn">${esc(name)}</span><span class="rp">${price}</span><span class="rm">${esc(meta)}</span></button>`; }
function priceNative(v,cur){ try{ return new Intl.NumberFormat("de-DE",{style:"currency",currency:(cur==="GBp"?"GBP":cur)||"EUR",maximumFractionDigits:Math.abs(v)<10?4:2}).format(cur==="GBp"?v/100:v); }catch(e){ return nfQ.format(v)+" "+esc(cur||""); } }
function apiMsg(e){ return (e&&e.message)||"Das hat nicht geklappt."; }

/* ---------- Handy: Schnappschuss entschlüsseln ---------- */
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64eJs=u=>{ let s=""; for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
function concatBytes(...parts){ const n=parts.reduce((s,p)=>s+p.length,0), out=new Uint8Array(n); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; }
async function snapDeriveKey(password,salt,iter){
  if(!window.crypto||!crypto.subtle) throw new Error("Die Seite muss über https geöffnet werden, sonst kann der Browser nicht entschlüsseln.");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,512));
}
async function snapDecrypt(f,key){
  const salt=b64d(f.salt), nonce=b64d(f.nonce), ct=b64d(f.ct), tag=b64d(f.tag);
  const kMac=await crypto.subtle.importKey("raw",key.slice(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const ok=await crypto.subtle.verify("HMAC",kMac,tag,concatBytes(new TextEncoder().encode("depot-v1"),salt,nonce,ct));
  if(!ok){ const e=new Error("Passwort stimmt nicht."); e.code="badpw"; throw e; }
  const kEnc=await crypto.subtle.importKey("raw",key.slice(0,32),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const nb=Math.ceil(ct.length/32), out=new Uint8Array(ct.length);
  for(let s=0;s<nb;s+=512){
    const jobs=[];
    for(let i=s;i<Math.min(nb,s+512);i++){ const m=new Uint8Array(20); m.set(nonce); new DataView(m.buffer).setUint32(16,i); jobs.push(crypto.subtle.sign("HMAC",kEnc,m)); }
    const ks=await Promise.all(jobs);
    ks.forEach((buf,j)=>{ const blk=new Uint8Array(buf), base=(s+j)*32; for(let b=0;b<32&&base+b<ct.length;b++) out[base+b]=ct[base+b]^blk[b]; });
  }
  if(typeof DecompressionStream==="undefined") throw new Error("Dieser Browser ist zu alt. Bitte iOS bzw. den Browser aktualisieren.");
  const text=await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  return JSON.parse(text);
}

async function snapLoad(silent){
  try{ SNAPFILE=await snapFetch(); }
  catch(e){ if(silent)return; snapLockScreen(e.message); return; }
  let key=S.snapKey;
  const kept=snapKeyGet();
  if(!key&&kept&&kept.salt===SNAPFILE.salt) key=b64d(kept.key);
  if(key&&S.snapKey&&!silent){}
  if(!key||(S.snapKey&&kept&&kept.salt!==SNAPFILE.salt)){ if(!silent||!S.snapKey) snapLockScreen(); return; }
  try{ S.snapKey=key; snapApply(await snapDecrypt(SNAPFILE,key)); }
  catch(e){ snapKeySet(null); S.snapKey=null; snapLockScreen(e.code==="badpw"?"Das Passwort wurde am Mac geändert. Bitte neu eingeben.":e.message); }
}

/* ---------- Dialoge ---------- */
function closeModal(){ document.getElementById("modal").innerHTML=""; document.removeEventListener("keydown",escClose); }
function escClose(e){ if(e.key==="Escape")closeModal(); }
function showModal(html,wide){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="overlay"><div class="dialog ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  m.querySelector(".overlay").addEventListener("mousedown",e=>{ if(e.target.classList.contains("overlay"))closeModal(); });
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  document.addEventListener("keydown",escClose);
  return m.querySelector(".dialog");
}

function heldAt(sym,date,excludeId){
  let h=0; S.tx.filter(t=>t.symbol===sym&&t.id!==excludeId&&t.date<=date).forEach(t=>{ if(t.type==="buy")h+=+t.qty||0; else if(t.type==="sell")h-=+t.qty||0; }); return Math.max(0,h);
}

function exportCsv(){
  const head=["Datum","Typ","Ticker","Name","Klasse","ISIN","Stueck","Kurs_EUR","Betrag_EUR","Gebuehren_EUR","Steuern_EUR","Broker","Notiz"];
  const q=v=>{ const s=String(v??""); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const dec=v=>String(v).replace(".",",");
  const rows=S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>{ const a=S.assets[t.symbol]||{}; return [t.date,TYPE[t.type],a.ticker||t.symbol,a.name||"",(CLS[a.cls]||CLS.other).label,a.isin||"",IS_INCOME(t.type)?"":dec(t.qty),IS_INCOME(t.type)?"":dec(t.price),dec(txAmount(t)),dec(+t.fee||0),dec(+t.tax||0),t.broker||"",t.note||""].map(q).join(";"); });
  const csv="﻿"+head.join(";")+"\n"+rows.join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const el=document.createElement("a"); el.href=url; el.download="depot-transaktionen-"+localToday()+".csv"; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||""; const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[]; let row=[], cur="", inq=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=c; }
    else if(c==='"')inq=true; else if(c===sep){row.push(cur);cur="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importCsv(file){
  const text=await file.text(); const rows=parseCsv(text);
  if(rows.length<2){ toast("Die Datei enthält keine Zeilen."); return; }
  const H=rows[0].map(h=>h.trim().toLowerCase().replace(/ü/g,"ue").replace(/ä/g,"ae").replace(/ö/g,"oe"));
  const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const ci={date:col("datum","date"),type:col("typ","type"),ticker:col("ticker","symbol"),name:col("name"),cls:col("klasse","class"),isin:col("isin"),qty:col("stueck","stuck","anzahl","qty","menge"),price:col("kurs","preis","price"),amount:col("betrag","amount"),fee:col("gebuehr","fee"),tax:col("steuer","tax"),broker:col("broker","depot"),note:col("notiz","note")};
  if(ci.ticker<0)ci.ticker=ci.isin;
  if(ci.date<0||ci.type<0||ci.ticker<0){ toast("Gebraucht werden die Spalten Datum, Typ und Ticker oder ISIN."); return; }
  const typeMap={kauf:"buy",buy:"buy",verkauf:"sell",sell:"sell",dividende:"dividend",dividend:"dividend",ausschuettung:"dividend",zinsen:"interest",zins:"interest",interest:"interest"};
  const clsMap={}; Object.entries(CLS).forEach(([k,c])=>{ clsMap[c.label.toLowerCase()]=k; clsMap[k]=k; });
  const g=(r,i)=>i>=0?(r[i]||"").trim():"";
  const out=rows.slice(1).map(r=>{
    let date=g(r,ci.date); const m=date.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/); if(m)date=(m[3].length===2?"20"+m[3]:m[3])+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
    const type=typeMap[g(r,ci.type).toLowerCase().replace(/ü/g,"ue")]||"";
    const isin=g(r,ci.isin).toUpperCase(); const tick=g(r,ci.ticker);
    const row={date,type,ticker:ISIN_RE.test(isin)?isin:tick,tickerShown:ISIN_RE.test(isin)&&tick!==isin?tick:"",name:g(r,ci.name),cls:clsMap[g(r,ci.cls).toLowerCase()]||"",qty:parseNum(g(r,ci.qty))||0,price:parseNum(g(r,ci.price))||0,fee:parseNum(g(r,ci.fee))||0,tax:parseNum(g(r,ci.tax))||0,broker:g(r,ci.broker),note:g(r,ci.note)};
    if(type==="dividend"||type==="interest") row.amount=parseNum(g(r,ci.amount))||0;
    return row;
  });
  toast("Import läuft, Assets werden gesucht …");
  try{ const r=await api("POST","/api/import",{rows:out}); await load(); setTimeout(poll,800);
    toast(`${r.added} Transaktionen importiert${r.newAssets?", "+r.newAssets+" neue Assets":""}${r.skipped.length?", "+r.skipped.length+" übersprungen":""}`);
    if(r.skipped.length) console.warn("Übersprungen:",r.skipped);
  }catch(e){ toast(apiMsg(e)); }
}
