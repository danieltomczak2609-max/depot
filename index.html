<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depot-Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E141A">
<meta name="robots" content="noindex">
<style>
/* Layout: Cockpit — Kopfzeile mit Depotwert, darunter Reiter (Übersicht · Journal · Analyse); Karten nur für Chart, Tabellen und Dialoge. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#142230; --muted:#5D6A77; --line:#D8DEE5;
  --accent:#2148C0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FA;
  --gain:#0E8459; --gain-soft:#DDF2E8; --loss:#BF3F2B; --loss-soft:#F8E2DD; --warn:#A86A00; --warn-soft:#FBEFD6;
  --c-stock:#2148C0; --c-etf:#14897F; --c-crypto:#D48A0B; --c-commodity:#8C5A2B; --c-index:#7448B8; --c-bond:#4F6378; --c-other:#8A939C;
  --shadow:0 1px 2px rgba(20,34,48,.06),0 4px 16px rgba(20,34,48,.05);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  --f-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2631; --ink:#E5ECF2; --muted:#8E9BA8; --line:#283442;
  --accent:#7D9BFF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
  --gain:#3DC98F; --gain-soft:#14342A; --loss:#FF7C68; --loss-soft:#3A1F1B; --warn:#F0B44C; --warn-soft:#3A2D14;
  --c-stock:#7D9BFF; --c-etf:#3CC2B4; --c-crypto:#F2AE3D; --c-commodity:#C99063; --c-index:#B08CF0; --c-bond:#93A6BA; --c-other:#A6AFB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2631; --ink:#E5ECF2; --muted:#8E9BA8; --line:#283442;
  --accent:#7D9BFF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
  --gain:#3DC98F; --gain-soft:#14342A; --loss:#FF7C68; --loss-soft:#3A1F1B; --warn:#F0B44C; --warn-soft:#3A2D14;
  --c-stock:#7D9BFF; --c-etf:#3CC2B4; --c-crypto:#F2AE3D; --c-commodity:#C99063; --c-index:#B08CF0; --c-bond:#93A6BA; --c-other:#A6AFB8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);letter-spacing:-.02em}
.muted{color:var(--muted)}
.pos{color:var(--gain)} .neg{color:var(--loss)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.total{font-family:var(--f-num);font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:-.04em;line-height:1.05}
.subline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600}
.pill.pos{background:var(--gain-soft)} .pill.neg{background:var(--loss-soft)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.picker{position:relative;display:flex;flex-direction:column;gap:6px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:320px;overflow-y:auto}
.results:empty{display:none}
.results .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 12px 4px;background:var(--surface-2)}
.results .msg{padding:10px 12px;color:var(--muted);font-size:13px}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;width:100%}
.res:first-child,.grp+.res{border-top:0}
.res:hover,.res.active{background:var(--accent-soft)}
.res .rn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rm{grid-column:1;font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:-.02em}
.res .rp{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--f-num);font-size:13px}
.res .eur{color:var(--gain);font-weight:700;font-family:var(--f-body);font-size:11px;margin-left:4px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.picked .asset .n{max-width:none}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.share2{display:grid;grid-template-columns:72px auto;gap:3px 8px;align-items:center;justify-content:end}
.share2 .b{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block}
.share2 .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.share2 .b.inv i{background:var(--muted);opacity:.55}
.share2 .num{font-size:12px;text-align:right;min-width:42px}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:7px;border-radius:4px;display:inline-block}
.arange{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:13px}
.dalio-h{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.dalio-h p{margin:0;font-size:14px}
.statrow{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.statrow.small b{font-size:16px}
.big-num{font-family:var(--f-num);font-size:30px;letter-spacing:-.03em;line-height:1.1}
.heat2{border-collapse:separate;border-spacing:3px}
.heat2 td{min-width:46px;height:34px;text-align:center;font-family:var(--f-num);font-size:11px;border-radius:5px;padding:0;border:0}
.heat2 th{font-size:11px;color:var(--muted);font-weight:600;padding:3px;white-space:nowrap;text-transform:none;letter-spacing:0;border:0}
.riskrow,.attr{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.riskrow .lbl,.attr .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riskrow .bars{display:flex;flex-direction:column;gap:2px}
.riskrow .bars i{display:block;height:7px;border-radius:4px}
.riskrow .vals{font-size:12px;text-align:right;line-height:1.35}
.axis-bar{display:grid;grid-template-columns:1fr 1fr;height:12px}
.axis-bar .half{display:flex;align-items:center}
.axis-bar .neg-side{justify-content:flex-end;border-right:1px solid var(--muted)}
.axis-bar i{display:block;height:10px;border-radius:3px}
.divider{height:1px;background:var(--line);margin:8px 0}
body.snap .edit-only{display:none!important}
body:not(.snap) .snap-only{display:none!important}
.lock{max-width:440px;margin:24px auto;width:100%}
.lock-b{display:flex;flex-direction:column;gap:14px;padding:22px}
.lock-b h2{margin:0;font-size:20px}
.lock-b p{margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps a,.body a:not(.btn){color:var(--accent)}
details summary{font-size:14px}
@media (max-width:640px){.wrap{padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 48px max(14px,env(safe-area-inset-left,0px))}.total{font-size:34px}.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- Handy ---------- */
.m-stack{display:flex;flex-direction:column;gap:14px}
#banner:empty{display:none}
body.snap .top .actions{display:none}
.m-chart{padding:12px 0 12px}
.m-chart .chart-head{padding:4px 14px 0}
.m-chart .chart-head .muted{display:none}
.m-chart .chart-head .big{font-size:26px}
.m-chart .chart{padding:0 4px}
.m-modes{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--line)}
.m-modes button{background:none;border:0;padding:6px 0 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.m-modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.m-ranges{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 10px 0}
.m-ranges button{background:none;border:0;border-radius:999px;padding:8px 0;font-weight:700;font-size:13px;color:var(--muted)}
.m-ranges button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-tiles.three{grid-template-columns:repeat(3,1fr)}
.m-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.m-tile .k{font-size:12px;color:var(--muted);font-weight:600}
.m-tile b{font-family:var(--f-num);font-weight:500;font-size:17px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-tile .s{font-size:11px;color:var(--muted);line-height:1.3}
.m-fine{margin:0 2px;font-size:12px;color:var(--muted)}
.m-sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.m-sec-h h2{margin:0;font-size:17px}
.m-alloc{padding:14px}
.m-stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.m-stackbar i{display:block;height:100%;min-width:2px}
.m-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:13px}
.m-legend span{display:flex;align-items:center;gap:7px;min-width:0}
.m-legend span i{width:9px;height:9px;border-radius:3px;flex:none}
.m-legend b{margin-left:auto;font-family:var(--f-num);font-weight:500;font-size:12px}
.m-chips{display:flex;gap:6px;flex-wrap:wrap}
.m-chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.m-chips.scroll::-webkit-scrollbar{display:none}
.m-chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.m-chips.small button{padding:4px 10px;font-size:12px}
.m-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.m-list{display:flex;flex-direction:column;gap:8px}
.m-pos{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;width:100%}
.m-pos:active,.m-tx:active{transform:scale(.99)}
.m-av{grid-row:1 / span 2;align-self:center;display:flex;position:relative}
.m-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.m-main .n{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-main .t{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-main .t.note{font-style:italic}
.m-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.m-right b{font-family:var(--f-num);font-weight:500;font-size:15px;letter-spacing:-.03em;white-space:nowrap}
.m-right .t{font-size:12px;color:var(--muted)}
.m-pl{font-family:var(--f-num);font-size:12px;white-space:nowrap}
.m-bars{grid-column:2/4;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:6px}
.m-bars .bt{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.m-bars .bt i{display:block;height:100%;border-radius:3px}
.m-bars .bt.inv i{background:var(--muted);opacity:.5}
.m-bars .lbl{font-family:var(--f-num);font-size:11px;text-align:right;min-width:78px;white-space:nowrap}
.m-day{font-family:var(--f-num);font-size:11px;text-align:right;white-space:nowrap}
.m-link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:12px;align-self:center}
.m-search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.m-month{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.m-month-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.05em}
.m-month-h span:last-child{font-family:var(--f-num);font-weight:500;text-transform:none;letter-spacing:-.02em}
.m-txs{padding:2px 0;border-radius:16px;overflow:hidden}
.m-tx{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 13px}
.m-tx:first-child{border-top:0}
.m-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.m-ic.buy{background:var(--accent-soft);color:var(--accent)}
.m-ic.sell{background:var(--warn-soft);color:var(--warn)}
.m-ic.dividend{background:var(--gain-soft);color:var(--gain)}
.m-ic.interest{background:color-mix(in srgb,var(--c-etf) 18%,var(--surface));color:var(--c-etf)}
@media (max-width:640px){
  .tabs{position:sticky;top:0;z-index:15;background:var(--bg);margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-left,0px)) 0}
  .tab{flex:1;text-align:center;padding:12px 6px}
  .top{align-items:flex-start}
  .subline{gap:6px 10px}
}
.lg{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);display:grid;place-items:center;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:contain;display:block}
.lg.ini{color:#fff;font-weight:800;font-size:calc(var(--s) * .34);letter-spacing:.02em;box-shadow:none}
.asset-row{display:flex;align-items:center;gap:9px;min-width:0}
#pos-table .asset .n{max-width:210px}
.m-refresh{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:28px;height:28px;margin-left:6px;font-size:15px;line-height:1;color:var(--accent);display:inline-grid;place-items:center}
.m-refresh:disabled{opacity:.5;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){body .dialog{animation:none}}
.m-alloc2{display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:center;padding:16px;text-align:left;width:100%;color:inherit}
.m-ring{position:relative;width:116px;height:116px;display:block}
.m-ring svg{display:block}
.m-ring .c,.sheet-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.m-ring .c b{font-family:var(--f-num);font-size:24px;font-weight:500;line-height:1}
.m-ring .c small{font-size:11px;color:var(--muted);margin-top:2px}
.m-alloc-l{display:flex;flex-direction:column;gap:7px;min-width:0}
.m-alloc-l .h{font-weight:700;font-size:16px;margin-bottom:2px}
.m-alloc-l .r{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.m-alloc-l .r i{width:9px;height:9px;border-radius:3px;flex:none}
.m-alloc-l .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.m-alloc-l .r b{margin-left:auto;font-family:var(--f-num);font-weight:500;font-size:13px}
.m-alloc-l .more{color:var(--accent);font-weight:600;font-size:13px;margin-top:2px}
.sheet-ring{position:relative;width:230px;height:230px;margin:4px auto 0}
.sheet-ring svg circle[data-i]{cursor:pointer;transition:stroke-width .15s,opacity .15s}
.sheet-ring .c{padding:40px}
.sheet-ring .c b{font-family:var(--f-num);font-size:24px;font-weight:500;letter-spacing:-.03em}
.sheet-ring .c small{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc-list{display:flex;flex-direction:column}
.alloc-row{display:grid;grid-template-columns:32px minmax(0,1fr) 110px;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;text-align:left;width:100%;border-radius:10px}
.alloc-row:first-child{border-top:0}
.alloc-row.on{background:var(--accent-soft)}
.alloc-pct{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.alloc-pct b{font-family:var(--f-num);font-weight:500;font-size:14px}
.alloc-pct .bt{width:100%;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.alloc-pct .bt i{display:block;height:100%;border-radius:3px}
@media (max-width:640px){
  body .overlay{align-items:flex-end;padding:0;padding-top:max(24px,env(safe-area-inset-top,0px))}
  body .dialog{border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .22s ease-out}
  body .dialog header{position:sticky;top:0;background:var(--surface);z-index:2;border-radius:20px 20px 0 0}
}
.bill{display:flex;flex-direction:column;gap:0;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.bill .eyebrow{margin-bottom:6px}
.bill-r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.bill-r:nth-child(2){border-top:0}
.bill-r .mono{font-size:14px;white-space:nowrap}
.bill-r.sum{font-weight:700;border-top:2px solid var(--muted);margin-top:2px;padding-top:8px}
.bill-r.sum .mono{font-size:16px}
@media (min-width:1100px){
  .wrap{max-width:2400px;padding:28px 40px 64px}
  #pos-table .asset .n{max-width:340px}
  #pos-table td,#pos-table th{padding-left:12px;padding-right:12px}
  .share2{grid-template-columns:110px auto}
}
@media (min-width:1100px) and (max-width:1399px){
  .wrap{padding-left:20px;padding-right:20px}
  #pos-table .asset .n{max-width:200px}
  #pos-table td,#pos-table th{padding-left:7px;padding-right:7px;font-size:13px}
  .share2{grid-template-columns:70px auto}
}
@media (min-width:1600px){
  .wrap{padding-left:56px;padding-right:56px}
  .kpi .v{font-size:19px}
}
.mk-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:-6px}
.mk-legend span{display:flex;align-items:center;gap:6px}
.mk-legend i{width:9px;height:9px;border-radius:50%;display:block}
.st .card-h{flex-wrap:wrap;gap:10px}
.st-say{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.st-say b{color:var(--ink);font-family:var(--f-num);font-weight:600;letter-spacing:-.02em}
.st-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st-worst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* KPI-Leiste */

/* Analyse */

/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field .hint{font-size:12px;color:var(--muted)}
.seg-type{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg-type button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px;font-weight:700}
.seg-type button[aria-pressed="true"].buy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg-type button[aria-pressed="true"].sell{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.seg-type button[aria-pressed="true"].dividend{background:var(--gain);color:var(--surface);border-color:var(--gain)}
.seg-type button[aria-pressed="true"].interest{background:var(--c-etf);color:var(--surface);border-color:var(--c-etf)}

.type.staking{background:color-mix(in srgb,var(--c-index) 18%,var(--surface));color:var(--c-index)}
.type.transfer{background:var(--surface-2);color:var(--muted)}
.m-ic.staking{background:color-mix(in srgb,var(--c-index) 18%,var(--surface));color:var(--c-index)}
.m-ic.transfer{background:var(--surface-2);color:var(--muted)}
.newasset{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.newasset .field input,.newasset .field select{background:var(--surface)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.sum .mono{font-size:18px}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60}
.status-line{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.live{width:7px;height:7px;border-radius:50%;background:var(--gain)}
.live.old{background:var(--warn)}
@media (max-width:640px){.hide-sm{display:none}}
@media (max-width:640px){#pos-table td,#pos-table th{padding:9px 3px}#pos-table th{font-size:10px;letter-spacing:.03em}#pos-table .asset .n{max-width:98px}#pos-table .asset .t{max-width:98px;overflow:hidden;text-overflow:ellipsis}.share2{grid-template-columns:30px auto;gap:3px 4px}.share2 .num{min-width:34px;font-size:11px}#pos-table{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="wrap" id="app">
  <nav class="pbar" id="pbar" aria-label="Depot wählen" hidden></nav>
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Depotwert</span>
      <div class="total" id="h-total">–</div>
      <div class="subline" id="h-sub"><span class="muted">Daten werden geladen …</span></div>
      <div class="h-mix" id="h-mix"></div>
    </div>
    <div class="actions">
      <button class="btn edit-only" id="btn-refresh" type="button">Kurse aktualisieren</button>
      <button class="btn primary edit-only" id="btn-add" type="button">+ Transaktion <kbd>N</kbd></button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="overview" aria-selected="true" type="button">Übersicht</button>
    <button class="tab" role="tab" data-view="journal" aria-selected="false" type="button">Transaktionen</button>
    <button class="tab" role="tab" data-view="analysis" aria-selected="false" type="button">Analyse</button>
  </nav>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="modal"></div>
<div id="toast-host"></div>

<script>
(function(){
"use strict";
/* ---------- Konstanten & Helfer ---------- */
const CLS={
  stock:{label:"Aktie",v:"--c-stock"}, etf:{label:"ETF",v:"--c-etf"}, crypto:{label:"Krypto",v:"--c-crypto"},
  commodity:{label:"Rohstoff",v:"--c-commodity"}, index:{label:"Index",v:"--c-index"}, bond:{label:"Anleihe",v:"--c-bond"}, other:{label:"Sonstiges",v:"--c-other"}
};
const TYPE={buy:"Kauf",sell:"Verkauf",dividend:"Dividende",interest:"Zinsen",staking:"Staking",transfer:"Transfer"};
const IS_INCOME=t=>t==="dividend"||t==="interest";
const MONTHS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const nfE=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const nfE0=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nfP=new Intl.NumberFormat("de-DE",{style:"percent",minimumFractionDigits:2,maximumFractionDigits:2,signDisplay:"exceptZero"});
const nfP1=new Intl.NumberFormat("de-DE",{style:"percent",maximumFractionDigits:1});
const nfQ=new Intl.NumberFormat("de-DE",{maximumFractionDigits:8});
function eur(v,sign){ if(v==null||!isFinite(v))return "–"; const s=nfE.format(v); return sign&&v>0?"+"+s:s; }
function eur0(v){ return v==null||!isFinite(v)?"–":nfE0.format(v); }
function pct(v){ return v==null||!isFinite(v)?"–":nfP.format(v); }
function priceFmt(v){ if(v==null||!isFinite(v))return "–"; const d=Math.abs(v)<1?6:Math.abs(v)<10?4:2; return new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:d}).format(v); }
function cls(v){ return v>0.0000001?"pos":v<-0.0000001?"neg":""; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sid(sym){ return String(sym).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,200); }
function parseNum(s){ if(typeof s==="number")return s; s=String(s||"").trim().replace(/\s|€/g,""); if(!s)return NaN; if(s.includes(","))s=s.replace(/\./g,"").replace(",","."); return Number(s); }
function localToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dnum(s){ return Math.round(Date.parse(s+"T00:00:00Z")/864e5); }
function dstr(n){ return new Date(n*864e5).toISOString().slice(0,10); }
function fmtDate(s){ if(!s)return "–"; const [y,m,d]=s.split("-"); return d+"."+m+"."+y; }
function fmtDateShort(s){ const [y,m,d]=s.split("-"); return d+"."+m+"."+y.slice(2); }
function ageText(iso){ if(!iso)return ""; const h=(Date.now()-Date.parse(iso))/36e5; if(!isFinite(h))return ""; if(h<1)return "vor "+Math.max(1,Math.round(h*60))+" Min."; if(h<48)return "vor "+Math.round(h)+" Std."; return "vor "+Math.round(h/24)+" Tagen"; }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function clsColor(c){ return "var("+(CLS[c]||CLS.other).v+")"; }

/* ---------- Zustand ---------- */
const S={tx:[],assets:{},quotes:{},loaded:{tx:false,assets:false,quotes:false},err:null,
  view:"overview",range:"MAX",mode:"pct",aRange:"2J",sort:{key:"value",dir:-1},showClosed:false,
  f:{q:"",type:"",broker:"",cls:""}};
let M=null;
S.status={}; S.rev=0;
try{ const v=localStorage.getItem("depot.ui"); if(v){ const o=JSON.parse(v); ["view","range","mode","aRange","stH"].forEach(k=>{ if(o[k])S[k]=o[k]; }); } }catch(e){}
function saveUi(){ try{ localStorage.setItem("depot.ui",JSON.stringify({view:S.view,range:S.range,mode:S.mode,aRange:S.aRange,stH:S.stH})); }catch(e){} }

/* ---------- Berechnung ---------- */
function compute(){
  const today=localToday();
  const txs=S.tx.filter(t=>t&&t.date&&TYPE[t.type]&&(t.symbol||t.type==="interest")).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  const pos={};
  const P=sym=>pos[sym]||(pos[sym]={symbol:sym,qty:0,cost:0,realized:0,soldCost:0,divs:0,staking:0,burn:0,fees:0,taxes:0,invested:0,brokers:{},lots:{},first:null,last:null,n:0});
  let interest=0, intFees=0, intTaxes=0;
  for(const t of txs){
    if(t.type==="interest"){ interest+=(+t.amount||0)-(+t.fee||0)-(+t.tax||0); intFees+=+t.fee||0; intTaxes+=+t.tax||0; continue; }
    const p=P(t.symbol), q=+t.qty||0, pr=+t.price||0, fee=(+t.fee||0)+(+t.tax||0), b=t.broker||"–";
    p.n++; p.first=p.first||t.date; p.last=t.date; p.fees+=+t.fee||0; p.taxes+=+t.tax||0;
    // Einstand je Broker: jeder Broker hat seinen eigenen Durchschnittspreis
    const L=p.lots[b]||(p.lots[b]={q:0,c:0});
    if(t.type==="buy"){ p.qty+=q; p.cost+=q*pr+fee; p.invested+=q*pr+fee; p.brokers[b]=(p.brokers[b]||0)+q; L.q+=q; L.c+=q*pr+fee; }
    else if(t.type==="sell"){
      const qq=Math.min(q,p.qty); let out=0, need=qq;
      const own=Math.min(need,L.q); if(own>0){ const c=L.c/L.q*own; out+=c; L.c-=c; L.q-=own; need-=own; }
      if(need>1e-12){ // Rest (Bestand liegt bei einem anderen Broker): anteilig aus den übrigen zum gemeinsamen Durchschnitt
        const others=Object.values(p.lots).filter(x=>x!==L&&x.q>1e-12), oq=others.reduce((s,x)=>s+x.q,0);
        if(oq>0){ const take=Math.min(need,oq); for(const x of others){ const share=take*x.q/oq, c=x.c/x.q*share; out+=c; x.c-=c; x.q-=share; } need-=take; } }
      if(L.q<1e-9){L.q=0;L.c=0;}
      p.realized+=qq*pr-fee-out; p.soldCost+=out; p.qty-=qq; p.brokers[b]=(p.brokers[b]||0)-qq;
      p.cost=Object.values(p.lots).reduce((s,x)=>s+x.c,0);
      if(p.qty<1e-9){p.qty=0;p.cost=0;for(const x of Object.values(p.lots)){x.q=0;x.c=0;}}
    }
    else if(t.type==="dividend"){ p.divs+=(+t.amount||0)-fee; }

    if(q&&q.hist&&typeof q.hist==="object") for(const [d,v] of Object.entries(q.hist)) if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&+v>0) m[d]=+v;

function localDateOf(iso){ const d=new Date(iso); if(isNaN(d))return localToday(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function rangeStart(series,range){
  const n=series.dates.length; if(!n)return 0;
  const last=dnum(series.dates[n-1]); let from;
  if(range==="1M")from=last-30; else if(range==="3M")from=last-91; else if(range==="1J")from=last-365; else if(range==="3J")from=last-1095;
  else if(range==="YTD")from=dnum(series.dates[n-1].slice(0,4)+"-01-01")-1; else return 0;

}

function analytics(series){
  const n=series.dates.length, out={};
  if(n<2)return out;
  // Drawdown
  let peak=series.idx[0], peakD=series.dates[0], mdd=0, mddFrom=null, mddTo=null;
  for(let i=0;i<n;i++){ const v=series.idx[i]; if(v>peak){peak=v;peakD=series.dates[i];} const dd=v/peak-1; if(dd<mdd){mdd=dd;mddFrom=peakD;mddTo=series.dates[i];} }
  out.mdd=mdd; out.mddFrom=mddFrom; out.mddTo=mddTo;
  out.curDD=series.idx[n-1]/Math.max(...series.idx)-1;
  // Volatilität (letzte 365 Tage)
  const rs=series.ret.slice(Math.max(1,n-365));
  const mean=rs.reduce((a,b)=>a+b,0)/rs.length;
  const sd=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,rs.length-1));
  out.vol=sd*Math.sqrt(365);
  const years=(n-1)/365.25;
  out.years=years;
  out.cagr=years>=1?Math.pow(series.idx[n-1],1/years)-1:null;
  out.sharpeLike=out.vol>0&&out.cagr!=null?out.cagr/out.vol:null;
  // Monatsrenditen + Monatszuflüsse
  const months={}; let prevIdx=1, prevKey=null;
  const flows={};
  for(let i=0;i<n;i++){
    const key=series.dates[i].slice(0,7);
    if(key!==prevKey){ if(prevKey)months[prevKey].end=series.idx[i-1]; months[key]={start:prevIdx}; prevKey=key; }
    prevIdx=series.idx[i]; flows[key]=(flows[key]||0)+series.flow[i];
  }
  months[prevKey].end=series.idx[n-1];
  out.months={}; for(const [k,v] of Object.entries(months)) out.months[k]=v.end/v.start-1;
  out.flows=flows;
  const mv=Object.entries(out.months);
  if(mv.length){ out.best=mv.reduce((a,b)=>b[1]>a[1]?b:a); out.worst=mv.reduce((a,b)=>b[1]<a[1]?b:a); out.posMonths=mv.filter(m=>m[1]>0).length; out.nMonths=mv.length; }
  return out;
}

function niceTicks(min,max,count){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, step0=span/Math.max(1,count), mag=Math.pow(10,Math.floor(Math.log10(step0))), r=step0/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo; v<=hi+step/2; v+=step) t.push(+v.toFixed(10));
  return t;
}

function donut(items,size){

/* ---------- Analyse ---------- */
/* ---------- Analyse (Quant) ---------- */
const RF=0.02; // Annahme risikofreier Zins p. a. (Tagesgeld)
const A_RANGES=[["1J",365],["2J",730],["3J",1095],["MAX",0]];
function aStartIdx(series){
  const n=series.dates.length; if(!n)return 0;
  const days=(A_RANGES.find(r=>r[0]===S.aRange)||A_RANGES[1])[1];
  if(!days)return 0;
  return Math.max(0,n-1-days);
}
function mean(a){ return a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN; }
function sd(a){ if(a.length<2)return NaN; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); }
function cov(a,b){ const ma=mean(a),mb=mean(b); let s=0; for(let i=0;i<a.length;i++)s+=(a[i]-ma)*(b[i]-mb); return s/(a.length-1); }
function corrOf(a,b){ const c=cov(a,b), x=sd(a), y=sd(b); return x&&y?c/(x*y):NaN; }
function quantile(a,q){ const s=a.slice().sort((x,y)=>x-y); if(!s.length)return NaN; const p=(s.length-1)*q, i=Math.floor(p); return s[i]+(s[Math.min(i+1,s.length-1)]-s[i])*(p-i); }
function fmtNum(v,d=2){ return v==null||!isFinite(v)?"–":v.toFixed(d).replace(".",","); }
// Kurs eines Datums aus einer Historie {datum:kurs} (letzter bekannter Wert davor)
function makeLookup(hist){ const ks=Object.keys(hist||{}).sort(); return d=>{ let lo=0,hi=ks.length-1,ans=-1; while(lo<=hi){ const m=(lo+hi)>>1; if(ks[m]<=d){ans=m;lo=m+1;} else hi=m-1; } return ans<0?null:hist[ks[ans]]; }; }
// Wochenrenditen einer Historie, Schlüssel = Datum des Wochenendes (Sonntag)
function weekKey(d){ const t=dnum(d), wd=(new Date(t*864e5).getUTCDay()+6)%7; return dstr(t-wd+6); }
function weeklyFromHist(hist,fromDate){
  const last={}; Object.keys(hist||{}).sort().forEach(d=>{ if(+hist[d]>0) last[weekKey(d)]=+hist[d]; });
  const ks=Object.keys(last).sort(), out={};
  for(let i=1;i<ks.length;i++){ if(ks[i]<fromDate)continue; out[ks[i]]=last[ks[i]]/last[ks[i-1]]-1; }
  return out;
}

function quant(){
  const se=M.series, n=se.dates.length;
  const Q={ok:false}; if(n<15)return Q;
  const s0=aStartIdx(se), from=se.dates[s0];
  Q.from=from; Q.to=se.dates[n-1]; Q.days=n-1-s0;
  // Depot: Wochenrenditen aus dem zeitgewichteten Index
  const pw={}; const lastByWeek={};
  for(let i=s0;i<n;i++){ lastByWeek[weekKey(se.dates[i])]={i,idx:se.idx[i],v:se.value[i]}; }
  const wk=Object.keys(lastByWeek).sort();
  for(let j=1;j<wk.length;j++){ const a=lastByWeek[wk[j-1]], b=lastByWeek[wk[j]]; if(a.v>1) pw[wk[j]]=b.idx/a.idx-1; }
  Q.pw=pw; const pr=Object.values(pw);
  Q.ret=se.idx[n-1]/se.idx[s0]-1;
  const yrs=Q.days/365.25; Q.yrs=yrs;
  Q.ann=yrs>=0.5?Math.pow(1+Q.ret,1/yrs)-1:null;
  Q.vol=pr.length>=8?sd(pr)*Math.sqrt(52):null;
  const rfw=RF/52;
  Q.sharpe=Q.vol?((mean(pr)-rfw)*52)/Q.vol:null;
  const down=Math.sqrt(mean(pr.map(r=>Math.min(0,r-rfw)**2)))*Math.sqrt(52);
  Q.sortino=pr.length>=8&&down>0?((mean(pr)-rfw)*52)/down:null;
  // Drawdown im Zeitraum
  let peak=se.idx[s0], mdd=0, mFrom=from, mTo=from, pk=from; Q.dd=[];
  for(let i=s0;i<n;i++){ if(se.idx[i]>peak){peak=se.idx[i];pk=se.dates[i];} const d=se.idx[i]/peak-1; Q.dd.push(d); if(d<mdd){mdd=d;mFrom=pk;mTo=se.dates[i];} }
  Q.mdd=mdd; Q.mddFrom=mFrom; Q.mddTo=mTo; Q.curDD=Q.dd[Q.dd.length-1];
  let since=n-1; while(since>s0&&Q.dd[since-s0]<-1e-6)since--; Q.ddDays=n-1-since;
  Q.calmar=Q.ann!=null&&mdd<0?Q.ann/Math.abs(mdd):null;
  Q.var95=pr.length>=26?quantile(pr,0.05):null;
  Q.cvar95=Q.var95!=null?mean(pr.filter(r=>r<=Q.var95)):null;
  Q.bestW=pr.length?Math.max(...pr):null; Q.worstW=pr.length?Math.min(...pr):null;
  Q.posW=pr.filter(r=>r>0).length; Q.nW=pr.length;
  // Vergleichsindex
  const bh=S.bench&&S.bench.hist;
  if(bh&&Object.keys(bh).length>20){
    const look=makeLookup(bh); const b0=look(from);
    if(b0){
      Q.benchLine=se.dates.slice(s0).map(d=>{ const v=look(d); return v?v/b0-1:0; });
      Q.bRet=Q.benchLine[Q.benchLine.length-1];
      Q.bAnn=yrs>=0.5?Math.pow(1+Q.bRet,1/yrs)-1:null;
      const bw=weeklyFromHist(bh,from); const common=Object.keys(pw).filter(k=>bw[k]!=null);
      if(common.length>=12){
        const x=common.map(k=>bw[k]), y=common.map(k=>pw[k]);
        Q.beta=cov(y,x)/cov(x,x); Q.corrB=corrOf(y,x);
        Q.alpha=((mean(y)-rfw)-Q.beta*(mean(x)-rfw))*52;
        Q.bVol=sd(x)*Math.sqrt(52);
        Q.te=sd(y.map((v,i)=>v-x[i]))*Math.sqrt(52);
      }
      let bpk=-1e9; Q.bdd=Q.benchLine.map(v=>{ const lvl=1+v; if(lvl>bpk)bpk=lvl; return lvl/bpk-1; });
      Q.bMdd=Math.min(...Q.bdd);
    }
  }
  // Positionen: Wochenrenditen, Korrelation, Risiko
  const open=Object.values(M.pos).filter(p=>p.qty>1e-9).sort((a,b)=>b.value-a.value);
  const W={}; open.forEach(p=>{ const q=S.quotes[p.symbol]; W[p.symbol]=weeklyFromHist(q&&q.hist||{},from); });

}

const ST_H=[["3M",13,"3 Monaten"],["6M",26,"6 Monaten"],["12M",52,"12 Monaten"],["3J",156,"3 Jahren"]];

// Wochenrenditen je Position und gemeinsame Wochenliste
function stInputs(){
  const open=Object.values(M.pos).filter(p=>p.qty>1e-9&&p.value>0);
  const V=open.reduce((s,p)=>s+p.value,0); if(!V)return null;
  const from=dstr(dnum(localToday())-ST_WEEKS*7-7);
  const W={}, cls={};
  open.forEach(p=>{ const q=S.quotes[p.symbol]; W[p.symbol]=weeklyFromHist(q&&q.hist||{},from); cls[p.symbol]=p.asset.cls||"other"; });
  if(S.bench&&S.bench.hist){ W.__ETF=weeklyFromHist(S.bench.hist,from); cls.__ETF="etf"; }
  const weeks=[...new Set(open.flatMap(p=>Object.keys(W[p.symbol])))].sort().filter(k=>k<=weekKey(localToday()));
  const w={}; open.forEach(p=>w[p.symbol]=p.value/V);

// Wochenrenditen des Depots mit festen Gewichten; Lücken = Median gleicher Klasse in derselben Woche

    pLoss:se.filter(x=>x<1).length/ST_N, pL20:se.filter(x=>x<.8).length/ST_N, pL40:se.filter(x=>x<.6).length/ST_N,

// Gewichte einer Variante: Position (oder Welt-ETF) auf Zielanteil, Rest anteilig
function stReweight(w,id,target){

  [[0,"--gain","unabhängig"],[0.2,"--accent","ρ 0,2"],[0.4,"--c-crypto","ρ 0,4"],[0.6,"--loss","ρ 0,6"]].forEach(([r,c,l])=>{ let d=""; for(let n=1;n<=20;n++)d+=(n>1?"L":"M")+X(n).toFixed(1)+" "+Y(risk(n,r)).toFixed(1); s+=`<path d="${d}" fill="none" stroke="var(${c})" stroke-width="2"/><text x="${X(20)-4}" y="${Y(risk(20,r))-6}" text-anchor="end" font-size="11" fill="var(${c})">${l}</text>`; });
  if(N>=1&&rho!=null){ const n=Math.min(20,N), y0=risk(n,Math.max(0,rho)); s+=`<circle cx="${X(n)}" cy="${Y(y0)}" r="7" fill="var(--ink)" stroke="var(--surface)" stroke-width="3"/><text x="${X(n)+(n>14?-12:12)}" y="${Y(y0)-12}" text-anchor="${n>14?"end":"start"}" font-size="12" font-weight="700" fill="var(--ink)">dein Depot</text>`; }
  return s+"</svg>";
}
function svgHist(rets,var95){
  const Wd=560,H=220,pl=36,pr=12,pt=12,pb=30; const lo=-0.2,hi=0.2,step=0.02,nb=Math.round((hi-lo)/step);
  const bins=new Array(nb).fill(0); rets.forEach(r=>{ const i=Math.max(0,Math.min(nb-1,Math.floor((r-lo)/step))); bins[i]++; });
  const mx=Math.max(1,...bins), X=v=>pl+(Wd-pl-pr)*(v-lo)/(hi-lo), Y=c=>pt+(H-pt-pb)*(1-c/mx), bw=(Wd-pl-pr)/nb;
  let s=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Verteilung der Wochenrenditen">`;
  niceTicks(0,mx,3).filter(t=>t<=mx&&Number.isInteger(t)).forEach(t=>s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`);
  bins.forEach((c,i)=>{ if(!c)return; const x=pl+i*bw, mid=lo+(i+.5)*step; s+=`<rect x="${(x+1).toFixed(1)}" y="${Y(c).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H-pb-Y(c)).toFixed(1)}" rx="2" fill="var(${mid<0?"--loss":"--gain"})" opacity=".8"/>`; });
  [-0.2,-0.1,0,0.1,0.2].forEach(v=>s+=`<text x="${X(v)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${v>0?"+":""}${Math.round(v*100)} %</text>`);
  if(var95!=null&&var95>lo){ const x=X(var95); s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${x-4}" y="${pt+10}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">VaR 95 %</text>`; }
  return s+"</svg>";
}
function shortName(p){ return (p.asset.name||p.symbol).replace(/ \(ADR\)| Kurs in Euro.*$/g,"").replace("Entertainment","Ent."); }

  <div class="arange"><span class="muted">Zeitraum für Kennzahlen und Diagramme</span>
    <div class="seg" id="seg-arange">${A_RANGES.map(([r])=>`<button type="button" data-r="${r}" aria-pressed="${S.aRange===r}">${r==="MAX"?"Max":r.replace("J"," J")}</button>`).join("")}</div>

    <p class="note" style="margin-top:14px">Sharpe und Sortino rechnen mit ${nfP1.format(RF)} risikofreiem Zins pro Jahr (Annahme für Tagesgeld). Beta, Alpha und Korrelation beziehen sich auf den Vanguard FTSE All-World als Maßstab für den weltweiten Aktienmarkt.</p>
  </div></section>

  <section class="card"><div class="card-h"><h2>Depot gegen Welt-Aktien</h2><div class="legend-row"><span><i class="sw" style="background:var(--accent)"></i>dein Depot (zeitgewichtet)</span><span><i class="sw" style="background:var(--muted)"></i>Welt-Aktien</span></div></div>

      <p class="note" style="margin-top:10px">Korrelation der Wochenrenditen. 0 = unabhängig, 1 = gleichlaufend, negativ = gegenläufig (blau). Rot markierte Paare liefern kaum zusätzliche Streuung.</p>

      <p class="note" style="margin-top:8px">${Q.var95!=null?`In 1 von 20 Wochen verlierst du mehr als <b>${pct(-Q.var95).replace("+","")}</b>, heute etwa ${eur0(-Q.var95*V)}. Wenn es so eine Woche gibt, im Schnitt <b>${pct(Q.cvar95)}</b> (Expected Shortfall).`:"Value at Risk erscheint ab 26 Wochen Historie."}</p>

  <section class="card"><div class="card-h"><h2>Monatsrenditen</h2><span class="muted" style="font-size:13px">zeitgewichtet, alle Jahre</span></div>

    ${years.map(y=>`<tr><td class="y">${y}</td>${MONTHS.map((_,i)=>{ const r=A.months[y+"-"+String(i+1).padStart(2,"0")]; return `<td style="background:${heatColor(r)}">${r==null?"":(r*100).toFixed(1).replace(".",",")}</td>`; }).join("")}<td style="background:${heatColor(yearRet(y))};font-weight:600">${yearRet(y)==null?"":(yearRet(y)*100).toFixed(1).replace(".",",")}</td></tr>`).join("")}

    </div></section>
    <section class="card"><div class="card-h"><h2>Nach Broker</h2></div><div class="card-b"><div class="hbars">
      ${brokerItems.map(([b,val])=>`<div class="hbar"><span class="lbl">${esc(b)}</span><span class="track"><i style="width:${(val/maxB*100).toFixed(1)}%;background:var(--accent)"></i></span><span class="val">${eur0(val)} · ${nfP1.format(val/V)}</span></div>`).join("")||'<span class="muted">Keine offenen Positionen</span>'}
    </div></div></section>

  <div class="grid2">

      ${fl.map(([m,f])=>`<div class="hbar"><span class="lbl">${monthLabel(m)}</span><span class="track"><i style="width:${(Math.abs(f)/maxF*100).toFixed(1)}%;background:var(${f>=0?"--accent":"--warn"})"></i></span><span class="val ${f<0?"neg":""}">${eur0(f)}</span></div>`).join("")}
    </div><p class="note" style="margin-top:12px">Käufe minus Verkäufe und Dividenden, letzte 12 Monate mit Bewegung.</p></div></section>

      ${staleList.length?`<span class="pill warn" style="align-self:flex-start">${staleList.length} ${staleList.length===1?"Kurs ist":"Kurse sind"} älter als 4 Tage</span>`:`<span class="pill pos" style="align-self:flex-start">Alle Kurse aktuell</span>`}
      <div class="toplist">${open.slice().sort((a,b)=>(a.priceAt||"")<(b.priceAt||"")?-1:1).map(p=>`<div class="it"><span>${esc(p.asset.name||p.symbol)} <span class="muted mono" style="font-size:11px">${esc(p.asset.ticker||p.symbol)}</span></span>${srcBadge(p,true)}</div>`).join("")}</div>
    </div></section>
  </div></div>`;

  v.querySelectorAll("#seg-arange button").forEach(b=>b.onclick=()=>{ S.aRange=b.dataset.r; saveUi(); render(); });
  drawAnalysisCharts(Q);
  stBind(v);
}
function drawAnalysisCharts(Q){

  if(hb){
    const lines=[{name:"Depot",values:dep,color:cssVar("--accent"),fill:false,width:2.2}];
    if(Q.benchLine) lines.unshift({name:"Welt-Aktien",values:Q.benchLine,color:cssVar("--muted"),width:1.6});
    lineChart(hb,{dates,lines,zero:true,height:260,fmt:(x,ax)=>ax?nfP1.format(x):pct(x)});
    if(!Q.benchLine) hb.insertAdjacentHTML("beforeend",'<p class="note" style="padding:0 8px">Die Vergleichslinie erscheint nach dem nächsten Kursabruf.</p>');

  const hd=document.getElementById("a-dd");
  if(hd){
    const lines=[{name:"Depot",values:Q.dd,color:cssVar("--loss"),fill:true}];
    if(Q.bdd) lines.unshift({name:"Welt-Aktien",values:Q.bdd,color:cssVar("--muted"),dash:true,width:1.5});
    lineChart(hd,{dates,lines,zero:true,height:200,fmt:(x,ax)=>ax?nfP1.format(x):pct(x)});

function plRow(k,sub,a,r,tot){ return `<div class="plb-r${tot?" tot":""}" role="row"><span class="l"><b>${k}</b><small>${sub}</small></span><span class="v ${cls(a)}">${eur(a,true)}</span><span class="v ${r==null?"muted":cls(r)}">${r==null?"–":pct(r)}</span></div>`; }
function pairV(a,r){ return `<span class="pair ${cls(a)}"><span>${eur(a,true)}</span><span>${r==null?"–":pct(r)}</span></span>`; }
function metric(k,v,s){ return `<div class="metric${String(v).includes('class="pair')?" wide":""}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s||""}</span></div>`; }
function monthLabel(k){ const [y,m]=k.split("-"); return MONTHS[+m-1]+" "+y.slice(2); }
function topItem(p){ return `<div class="it"><span>${esc(p.asset.name||p.symbol)}</span><span class="num ${cls(p.unrealPct)}"><strong>${pct(p.unrealPct)}</strong> · ${eur(p.unreal,true)}</span></div>`; }

function personStats(){

  for(const p of ["mama","daniel"]){
    S.tx=profTx(p).slice(); S.assets=(S.raw[p]&&S.raw[p].assets)||{};
    try{ out[p]=S.tx.length?{...compute().k,cash:cashState(S.raw[p].cash||{},S.tx).total}:null; }catch(e){ out[p]=null; }
  }
  S.tx=keep.tx; S.assets=keep.assets;
  PSTAT={ver:S.dataVer,data:out}; return out;
}

function cashFlow(t){ const q=+t.qty||0, pr=+t.price||0, fee=+t.fee||0, tax=+t.tax||0;
  if(t.type==="buy")return -(q*pr+fee+tax);
  if(t.type==="sell")return q*pr-fee-tax;
  if(t.type==="dividend"||t.type==="interest")return (+t.amount||0)-fee-tax;
  return -(fee+tax); }
function cashState(cash,txs){
  cash=cash||S.cash||{}; txs=txs||S.tx;
  const rows=Object.entries(cash).map(([b,c])=>{ let adj=0,n=0;
    for(const t of txs){ if(t.broker!==b)continue; if(t.date>c.date||(t.date===c.date&&c.setAt&&(t.createdAt||0)>c.setAt)){ adj+=cashFlow(t); n++; } }
    return {broker:b,amount:c.amount+adj,base:c.amount,date:c.date,adj,n,note:c.note||""}; }).sort((a,b)=>b.amount-a.amount);
  return {rows,total:rows.reduce((s,r)=>s+r.amount,0)};
}
function cashCard(){
  const cs=cashState(), ro=SNAP||S.profile==="family";
  if(!cs.rows.length&&ro) return "";

  <p class="note" style="margin:10px 0 0">Ab dem eingetragenen Stand rechnet die App selbst weiter: Käufe ziehen ab, Verkäufe, Dividenden und Zinsen kommen dazu. Liquide Mittel zählen nicht zum Depotwert und nicht zur Rendite.</p></div></section>`;

async function api(method,path,body){
  let r;
  if(/^\/api\//.test(path)&&!/[?&]p=/.test(path)&&S.profile==="mama") path+=(path.includes("?")?"&":"?")+"p=mama";
  try{ r=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("Die Depot-App läuft nicht. Starte sie mit „Depot starten“."); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&j.error)||("Fehler "+r.status));
  return j;
}
async function load(){
  try{
    const [j,jm]=await Promise.all([api("GET","/api/state?p=daniel"),api("GET","/api/state?p=mama")]);

  }catch(e){ S.offline=true; S.err="App nicht erreichbar"; }

}
let pollT=0;

function mountPicker(host,{onPick,placeholder,initial,allowManual,localFirst}){
  host.innerHTML=`<div class="picker"><input id="pk-q" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder||"Ticker, ISIN oder Name, z. B. AAPL, NASDAQ:AAPL, SAP, VWCE, BTC")}" value="${esc(initial||"")}" aria-label="Asset suchen"><div class="results" id="pk-res" role="listbox"></div></div>`;
  const inp=host.querySelector("#pk-q"), res=host.querySelector("#pk-res");
  let items=[], active=0, timer=0, seq=0; const cache={};
  const draw=(remote,loading,error)=>{
    const q=inp.value.trim(), qu=q.toUpperCase(); items=[]; let html="";
    if(!q){ res.innerHTML=""; return; }
    if(localFirst!==false){
      const loc=Object.entries(S.assets).filter(([id,a])=>[a.ticker,a.name,a.isin].some(x=>x&&String(x).toUpperCase().includes(qu))).slice(0,5);
      if(loc.length){ html+='<div class="grp">In deinem Depot</div>'; loc.forEach(([id,a])=>{ items.push({existing:true,id,a}); html+=resBtn(items.length-1,a.name,(a.ticker||"")+(a.exchange?" · "+a.exchange:"")+(a.isin?" · "+a.isin:""),""); }); }
    }
    if(loading) html+='<div class="msg">Suche …</div>';
    else if(error) html+=`<div class="msg">${esc(error)}</div>`;
    else if(remote){
      const fresh=remote.filter(r=>!items.some(it=>it.existing&&String(it.a.ovId)===String(r.ovId)));
      if(fresh.length){ html+='<div class="grp">Gefunden</div>'; fresh.forEach(r=>{ items.push({r}); html+=resBtn(items.length-1,r.name,[r.ticker,r.exchLabel,r.typeLabel||(CLS[r.cls]||CLS.other).label,r.isin].filter(Boolean).join(" · "),r.price!=null?priceNative(r.price,r.currency)+(r.currency==="EUR"?'<span class="eur">EUR</span>':""):""); }); }
      else if(!items.length) html+='<div class="msg">Nichts gefunden. Prüf die Schreibweise oder versuch die ISIN.</div>';
    }
    if(allowManual&&!loading){ items.push({manual:true,text:q}); html+=resBtn(items.length-1,"„"+q+"“ ohne Kursquelle anlegen","Kurs trägst du dann selbst ein",""); }
    res.innerHTML=html; active=0; mark();
    res.querySelectorAll(".res").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  };
  const mark=()=>res.querySelectorAll(".res").forEach(b=>b.classList.toggle("active",+b.dataset.i===active));
  const pick=i=>{ const it=items[i]; if(it)onPick(it); };
  const search=()=>{
    const q=inp.value.trim(); clearTimeout(timer);
    if(!q){ draw(); return; }
    if(cache[q.toUpperCase()]){ draw(cache[q.toUpperCase()]); return; }
    draw(null,true);
    timer=setTimeout(async()=>{
      const my=++seq;
      try{ const j=await api("GET","/api/search?q="+encodeURIComponent(q)); cache[q.toUpperCase()]=j.results||[]; if(my===seq&&inp.value.trim()===q)draw(j.results||[]); }
      catch(e){ if(my===seq)draw(null,false,e.message); }
    },380);
  };
  inp.addEventListener("input",search);
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1,active+1); mark(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); mark(); }
    else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); if(items.length)pick(active); }
  });
  if(initial)search();
  setTimeout(()=>inp.focus(),30);
}

/* ---------- Handy: Schnappschuss entschlüsseln ---------- */
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64eJs=u=>{ let s=""; for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
function concatBytes(...parts){ const n=parts.reduce((s,p)=>s+p.length,0), out=new Uint8Array(n); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; }
async function snapDeriveKey(password,salt,iter){
  if(!window.crypto||!crypto.subtle) throw new Error("Die Seite muss über https geöffnet werden, sonst kann der Browser nicht entschlüsseln.");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,512));
}
async function snapDecrypt(f,key){
  const salt=b64d(f.salt), nonce=b64d(f.nonce), ct=b64d(f.ct), tag=b64d(f.tag);
  const kMac=await crypto.subtle.importKey("raw",key.slice(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const ok=await crypto.subtle.verify("HMAC",kMac,tag,concatBytes(new TextEncoder().encode("depot-v1"),salt,nonce,ct));
  if(!ok){ const e=new Error("Passwort stimmt nicht."); e.code="badpw"; throw e; }
  const kEnc=await crypto.subtle.importKey("raw",key.slice(0,32),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const nb=Math.ceil(ct.length/32), out=new Uint8Array(ct.length);
  for(let s=0;s<nb;s+=512){
    const jobs=[];
    for(let i=s;i<Math.min(nb,s+512);i++){ const m=new Uint8Array(20); m.set(nonce); new DataView(m.buffer).setUint32(16,i); jobs.push(crypto.subtle.sign("HMAC",kEnc,m)); }
    const ks=await Promise.all(jobs);
    ks.forEach((buf,j)=>{ const blk=new Uint8Array(buf), base=(s+j)*32; for(let b=0;b<32&&base+b<ct.length;b++) out[base+b]=ct[base+b]^blk[b]; });
  }
  if(typeof DecompressionStream==="undefined") throw new Error("Dieser Browser ist zu alt. Bitte iOS bzw. den Browser aktualisieren.");
  const text=await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  return JSON.parse(text);
}

/* ---------- Handy-Ansicht (nur lesen) ---------- */
const SNAP=!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const BUILD="115b27c47e2b";
// Ist die Seite älter als der Depotstand, einmal mit neuer Adresse laden (umgeht den Zwischenspeicher)
function snapCheckBuild(obj){
  if(!obj||!obj.build||BUILD===obj.build||BUILD.indexOf("DEPOT_")>=0)return false;
  const key="depot.reloaded."+obj.build;
  try{ if(sessionStorage.getItem(key))return false; sessionStorage.setItem(key,"1"); }catch(e){ return false; }
  location.replace(location.pathname+"?b="+obj.build);
  return true;
}
let SNAPFILE=null;
function snapKeyGet(){ try{ return JSON.parse(localStorage.getItem("depot.key")||"null"); }catch(e){ return null; } }
function snapKeySet(v){ try{ v?localStorage.setItem("depot.key",JSON.stringify(v)):localStorage.removeItem("depot.key"); }catch(e){} }
async function snapFetch(){
  const r=await fetch("depot.enc?t="+Date.now(),{cache:"no-store"});
  if(r.status===404) throw new Error("Noch kein Depotstand hochgeladen. Richte den Handy-Zugriff am Mac ein.");
  if(!r.ok) throw new Error("Depotstand nicht abrufbar (Status "+r.status+").");
  return r.json();
}
function snapApply(obj){
  if(snapCheckBuild(obj))return;
  const dbs=obj.dbs||{daniel:{transactions:obj.transactions,assets:obj.assets}};
  for(const p of ["daniel","mama"]){ const d=dbs[p]||{}; S.raw[p]={tx:(d.transactions||[]).map(t=>({...t,symbol:t.asset})),assets:d.assets||{},cash:d.cash||{}}; }
  S.gate=obj.danielGate||null; S.dataVer++;
  if(S.profile==="daniel"&&!gateUnlocked()) S.profile=null;
  applyProfile();
  S.quotes=obj.quotes||{}; S.bench=obj.bench||null; S.logos=obj.logos||{}; S.avatars=obj.avatars||{}; S.status=obj.status||{};
  S.snapAt=obj.snapshotAt; S.offline=false; S.err=null; S.loaded={tx:true,assets:true,quotes:true};
  S.snapLoadedAt=Date.now();
  schedule(); renderFoot();
}
function snapLockScreen(msg){

  document.getElementById("h-total").textContent="••••";
  document.getElementById("h-sub").innerHTML='<span class="muted">Gesperrt</span>';
  v.innerHTML=`<section class="card lock"><form id="unlock" class="lock-b" autocomplete="off">
    <h2>Depot entsperren</h2>

    <div class="field"><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required></div>
    <label class="muted" style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="pw-keep" checked> Auf diesem Gerät merken</label>
    <div class="err" id="pw-err" role="alert">${esc(msg||"")}</div>

      if(!SNAPFILE) SNAPFILE=await snapFetch();

  };

async function snapLoad(silent){
  try{ SNAPFILE=await snapFetch(); }
  catch(e){ if(silent)return; snapLockScreen(e.message); return; }
  let key=S.snapKey;
  const kept=snapKeyGet();
  if(!key&&kept&&kept.salt===SNAPFILE.salt) key=b64d(kept.key);
  if(key&&S.snapKey&&!silent){}
  if(!key||(S.snapKey&&kept&&kept.salt!==SNAPFILE.salt)){ if(!silent||!S.snapKey) snapLockScreen(); return; }
  try{ S.snapKey=key; snapApply(await snapDecrypt(SNAPFILE,key)); snapLive(false); }
  catch(e){ snapKeySet(null); S.snapKey=null; snapLockScreen(e.code==="badpw"?"Das Passwort wurde am Mac geändert. Bitte neu eingeben.":e.message); }
}
function snapLock(){ snapKeySet(null); S.snapKey=null; S.tx=[]; S.assets={}; S.quotes={}; S.bench=null; S.raw={daniel:{tx:[],assets:{},cash:{}},mama:{tx:[],assets:{},cash:{}}}; S.cash={}; S.profile=null; S.gateOk=null; try{ localStorage.removeItem("depot.dgate"); sessionStorage.removeItem("depot.profile"); }catch(e){} renderProfileBar(); snapLockScreen(); renderFoot(); }

/* ---------- Handy: Kurse direkt bei onvista holen ---------- */
const OVB="https://api.onvista.de/api/v1";
const BENCH_NOTATION=262733170, BENCH_TYPE="FUND", BENCH_ID="156424987";
const fxCache={};
async function ovGet(url){ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("onvista "+r.status); return r.json(); }
function normCur(c){ if(c==="GBp"||c==="GBX")return ["GBP",0.01]; if(c==="ZAc"||c==="ZAC")return ["ZAR",0.01]; if(c==="ILA")return ["ILS",0.01]; return [(c||"EUR").toUpperCase(),1]; }
async function ecbSeries(cur,from){
  const key=cur+"|"+from; if(fxCache[key])return fxCache[key];
  const r=await fetch(`https://data-api.ecb.europa.eu/service/data/EXR/D.${cur}.EUR.SP00.A?startPeriod=${from}&format=csvdata`);
  if(!r.ok) throw new Error("EZB "+r.status);
  const L=(await r.text()).trim().split(/\r?\n/), H=L[0].split(","), it=H.indexOf("TIME_PERIOD"), iv=H.indexOf("OBS_VALUE"), m={};
  L.slice(1).forEach(l=>{ const p=l.split(","), v=parseFloat(p[iv]); if(v>0)m[p[it]]=v; });
  return fxCache[key]=m;
}
function rateOn(fx,d){ if(!fx)return 1; const ks=Object.keys(fx).sort(); let r=null; for(const k of ks){ if(k<=d)r=fx[k]; else break; } return r||fx[ks[ks.length-1]]||1; }
async function fillGap(type,id,notation,hist,factor,fx){
  const ks=Object.keys(hist).sort(), last=ks[ks.length-1], today=localToday();
  if(!last||dnum(today)-dnum(last)<=3)return;
  const eod=await ovGet(`${OVB}/instruments/${type}/${encodeURIComponent(id)}/eod_history?idNotation=${notation}&range=Y1&startDate=${dstr(dnum(last)+1)}`);
  (eod.datetimeLast||[]).forEach((t,i)=>{ const v=(eod.last||[])[i]; if(v==null)return; const d=new Date(t*1000).toISOString().slice(0,10); hist[d]=v*factor/rateOn(fx,d); });
}
async function liveAsset(a,q){
  const snap=await ovGet(`${OVB}/instruments/${a.ovType}/${encodeURIComponent(a.ovId)}/snapshot`);
  const list=(snap.quoteList&&snap.quoteList.list)||[];
  const qe=list.find(x=>x.market&&String(x.market.idNotation)===String(a.notation))||snap.quote;
  if(!qe||qe.last==null) throw new Error("kein Kurs");
  const [cur,f]=normCur(qe.isoCurrency||a.currency), today=localToday();
  const hist=q.hist||(q.hist={}), ks=Object.keys(hist).sort(), last=ks[ks.length-1];
  const fx=cur==="EUR"?null:await ecbSeries(cur,dstr((last?dnum(last):dnum(today)-30)-10));
  try{ await fillGap(a.ovType,a.ovId,a.notation,hist,f,fx); }catch(e){}
  const pe=qe.last*f/rateOn(fx,today);
  hist[today]=pe;
  Object.assign(q,{priceEur:pe,price:qe.last,currency:cur,asOf:qe.datetimeLast?new Date(qe.datetimeLast).toISOString():new Date().toISOString(),source:"onvista · live am Handy",error:null});
}
async function liveBench(){
  if(!S.bench||!S.bench.hist)return;
  const hist=S.bench.hist;
  try{ await fillGap(BENCH_TYPE,BENCH_ID,BENCH_NOTATION,hist,1,null); }catch(e){}
  const snap=await ovGet(`${OVB}/instruments/${BENCH_TYPE}/${BENCH_ID}/snapshot`);
  const qe=((snap.quoteList&&snap.quoteList.list)||[]).find(x=>x.market&&x.market.idNotation===BENCH_NOTATION);
  if(qe&&qe.last!=null) hist[localToday()]=qe.last;
}
async function snapLive(manual){

}

/* Ringdiagramm für die Aufteilung (Handy) */
function ringSvg(items,size,thick,sel){
  const r=(size-thick)/2, c=2*Math.PI*r, gap=items.length>1?Math.min(3,c/items.length/4):0;
  let off=0, s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><g transform="rotate(-90 ${size/2} ${size/2})">`;
  s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${thick}"/>`;
  items.forEach((it,i)=>{
    const len=Math.max(0.6,it.share*c-gap);
    const dim=sel!=null&&sel!==i;
    s+=`<circle data-i="${i}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${it.col}" stroke-width="${sel===i?thick+6:thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" opacity="${dim?.28:1}"/>`;
    off+=it.share*c;
  });
  return s+"</g></svg>";
}

  return open.map((p,i)=>({p,share:p.share,col:posColor(i)}));
}

const TX_ICON={buy:"＋",sell:"−",dividend:"%",interest:"€",staking:"✦",transfer:"⇄"};
function txSigned(t){
  const fee=(+t.fee||0)+(+t.tax||0), a=txAmount(t);
  if(t.type==="buy")return -(a+fee);
  if(t.type==="sell")return a-fee;
  if(t.type==="transfer")return -fee;
  return a-fee;
}

function renderJListMobile(host){
  const q=S.f.q.trim().toLowerCase();
  const rows=S.tx.filter(t=>{
    const a=S.assets[t.symbol]||{};
    if(S.f.type&&t.type!==S.f.type)return false;
    if(S.f.broker&&t.broker!==S.f.broker)return false;
    if(q&&!((t.type==="interest"?"zinsen ":"")+(a.ticker||"")+" "+(a.isin||"")+" "+(a.name||"")+" "+(t.note||"")+" "+(t.broker||"")).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));
  if(!rows.length){ host.innerHTML=`<div class="card"><div class="empty">${S.tx.length?"Keine Buchung passt zu Suche oder Filter.":"Noch keine Transaktionen."}</div></div>`; return; }
  let buy=0,sell=0,inc=0; rows.forEach(t=>{ const s=txSigned(t); if(t.type==="buy")buy+=-s; else if(t.type==="sell")sell+=s; else if(t.type!=="transfer")inc+=s; });
  const groups={}; rows.forEach(t=>{ (groups[t.date.slice(0,7)]=groups[t.date.slice(0,7)]||[]).push(t); });
  const monthName=k2=>{ const [y,m]=k2.split("-"); return ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][+m-1]+" "+y; };
  host.innerHTML=`<div class="m-tiles three">
      <div class="m-tile"><span class="k">Gekauft</span><b>${eur0(buy)}</b></div>
      <div class="m-tile"><span class="k">Verkauft</span><b>${eur0(sell)}</b></div>
      <div class="m-tile"><span class="k">Erträge</span><b class="${cls(inc)}">${eur0(inc)}</b></div></div>
    <p class="m-fine">${rows.length} ${rows.length===1?"Buchung":"Buchungen"}${S.f.type||S.f.broker||q?" (gefiltert)":""}</p>
    ${Object.entries(groups).map(([mk,ts])=>{ const net=ts.reduce((s,t)=>s+txSigned(t),0);
      return `<section class="m-month"><div class="m-month-h"><span>${monthName(mk)}</span><span class="${cls(net)}">${eur(net,true)}</span></div>
      <div class="card m-txs">${ts.map(t=>{ const a=S.assets[t.symbol]||{}, s=txSigned(t), inc2=IS_INCOME(t.type);
        const name=t.type==="interest"?"Zinsen":(a.name||t.symbol||"?").replace(/ \(ADR\)| Kurs in Euro.*$/g,"");
        const detail=inc2?[TYPE[t.type],(+t.tax?"Steuer "+eur(+t.tax):""),t.broker].filter(Boolean).join(" · "):t.type==="transfer"?[TYPE[t.type],nfQ.format(+(+t.qty).toFixed(6))+" Stk.",(t.broker||"–")+" → "+(t.toBroker||"–"),+t.feeQty?"Gebühr "+nfQ.format(+t.feeQty)+" Stk.":""].filter(Boolean).join(" · "):[TYPE[t.type],nfQ.format(+(+t.qty).toFixed(4))+" × "+priceFmt(+t.price),t.broker].filter(Boolean).join(" · ");
        return `<button type="button" class="m-tx" data-id="${esc(t.id)}"><span class="m-ic ${t.type}">${TX_ICON[t.type]}</span>
          <span class="m-main"><span class="n">${esc(name)}</span><span class="t">${esc(detail)}</span>${t.note?`<span class="t note">${esc(t.note)}</span>`:""}</span>
          <span class="m-right"><b class="${s>0?"pos":""}">${eur(s,true)}</b><span class="t">${fmtDate(t.date).slice(0,6)}</span></span></button>`; }).join("")}</div></section>`; }).join("")}`;
  host.querySelectorAll(".m-tx").forEach(b=>b.onclick=()=>{ if(SNAP)return; openTx(S.tx.find(x=>x.id===b.dataset.id)); });

/* ---------- Dialoge ---------- */
function closeModal(){ document.getElementById("modal").innerHTML=""; document.removeEventListener("keydown",escClose); }
function escClose(e){ if(e.key==="Escape")closeModal(); }
function showModal(html,wide){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="overlay"><div class="dialog ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  m.querySelector(".overlay").addEventListener("mousedown",e=>{ if(e.target.classList.contains("overlay"))closeModal(); });
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  document.addEventListener("keydown",escClose);
  return m.querySelector(".dialog");
}

      <div class="field" data-amt hidden><label for="tx-amount" id="tx-amount-l">Dividende brutto (€)</label><input id="tx-amount" inputmode="decimal" value="${esc(numVal(t.amount))}" placeholder="0,00"></div>

      <div class="field"><label for="tx-broker" id="tx-broker-l">Broker</label><input id="tx-broker" list="dl-brokers" value="${esc(t.broker)}" placeholder="z. B. Trade Republic"><datalist id="dl-brokers">${brokers.map(b=>`<option value="${esc(b)}">`).join("")}</datalist></div>
      <div class="field" data-tr hidden><label for="tx-to">Nach Broker / Wallet</label><input id="tx-to" list="dl-brokers" value="${esc(t.toBroker||"")}" placeholder="z. B. Bitget"></div>
    </div>
    <div class="field"><label for="tx-note">Notiz (optional)</label><input id="tx-note" value="${esc(t.note||"")}" placeholder="z. B. Sparplan, Nachkauf im Dip"></div>
    <div class="sum"><span class="muted" id="tx-sum-l">Gesamt</span><span class="mono" id="tx-sum">–</span></div>
    <div class="err" id="tx-err" role="alert"></div>
  </form>
  <footer><button class="btn" data-close type="button">Abbrechen</button><button class="btn primary" id="tx-save" type="button">${edit?"Änderungen speichern":"Speichern"}</button></footer>`);
  let type=t.type;
  const $=s=>d.querySelector(s);
  const showChosen=()=>{
    const pk=$("#tx-picked"), pr=$("#tx-picker"), nw=$("#tx-new");
    if(!chosen){ pk.innerHTML=""; nw.hidden=true; mountPicker(pr,{onPick:it=>{ chosen=it; showChosen(); sync(); setTimeout(()=>(chosen.existing?$("#tx-qty"):$("#tx-tick")).focus(),20); },allowManual:true}); return; }
    pr.innerHTML="";
    let name,meta,priceHint="";
    if(chosen.existing){ const a=chosen.a, q=S.quotes[chosen.id], p=M.pos[chosen.id]; name=a.name; meta=(a.ticker||"")+(a.exchange?" · "+a.exchange:"")+(p&&p.qty>0?" · im Depot: "+nfQ.format(p.qty)+" Stück":"");
      if(q&&q.priceEur) priceHint=priceFmt(q.priceEur); nw.hidden=true; }
    else if(chosen.r){ const r=chosen.r; name=r.name; meta=[r.exchLabel,r.currency,r.isin].filter(Boolean).join(" · "); if(r.price!=null)priceHint=priceNative(r.price,r.currency);
      nw.hidden=false; $("#tx-tick").value=r.ticker||r.symbol||""; $("#tx-name").value=r.name; $("#tx-cls").value=r.cls||"other";
      $("#tx-newhint").textContent="Kurse kommen von "+(r.exchLabel||"dieser Börse")+(r.currency&&r.currency!=="EUR"?" in "+r.currency+". Trag deinen Kaufkurs trotzdem in Euro ein, die App rechnet selbst um.":". Ticker und Name kannst du anpassen, die Börse später per Klick auf die Position wechseln."); }
    else { name="„"+chosen.text+"“ ohne Kursquelle"; meta="Kurs trägst du selbst ein"; nw.hidden=false; $("#tx-tick").value=chosen.text.toUpperCase(); $("#tx-name").value=""; $("#tx-cls").value="other";
      $("#tx-newhint").textContent="Für Assets ohne Börsenkurs, etwa Anleihen oder Festgeld. Den aktuellen Kurs setzt du per Klick auf die Position."; }
    pk.innerHTML=`<div class="picked"><div class="asset"><span class="n">${esc(name)}</span><span class="t">${esc(meta)}</span></div><div style="display:flex;gap:8px;align-items:center">${priceHint?`<span class="mono muted" style="font-size:12px">${esc(priceHint)}</span>`:""}<button type="button" class="btn small" id="tx-change">Ändern</button></div></div>`;
    pk.querySelector("#tx-change").onclick=()=>{ chosen=null; showChosen(); sync(); };
  };
  const sync=()=>{
    d.querySelectorAll("#tx-type button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===type)));
    const inc=IS_INCOME(type), isInt=type==="interest";
    d.querySelectorAll("[data-qp]").forEach(e=>e.hidden=inc); d.querySelector("[data-amt]").hidden=!inc;
    $("#tx-amount-l").textContent=isInt?"Zinsen brutto (€)":"Dividende brutto (€)";
    $("#tx-assetf").hidden=isInt; $("#tx-inthint").hidden=!isInt; if(isInt)$("#tx-new").hidden=true; else if(chosen&&!chosen.existing)$("#tx-new").hidden=false;
    const isTr=type==="transfer", isSt=type==="staking";
    d.querySelectorAll("[data-tr]").forEach(e=>e.hidden=!isTr); d.querySelector("[data-px]").hidden=inc||isTr; $("#tx-taxf").hidden=isTr;
    $("#tx-qty-l").textContent=isTr?"Stück gesendet":isSt?"Stück erhalten":"Stück"; $("#tx-qty-h").hidden=!isTr;
    $("#tx-price-l").textContent=isSt?"Wert je Stück (€)":"Kurs je Stück (€)"; $("#tx-price-h").hidden=!isSt;
    $("#tx-fee-l").textContent=isTr?"Zusätzliche Gebühr (€)":"Gebühren (€)";
    $("#tx-fee-h").textContent=isTr?"meist 0, falls in Euro berechnet":isSt?"meist 0, Provision ist oft schon abgezogen":"Ordergebühr, Fremdspesen";
    $("#tx-broker-l").textContent=isTr?"Von Broker / Wallet":isSt?"Broker / Wallet":"Broker";
    if(isSt&&chosen&&chosen.existing&&!$("#tx-price").value&&!$("#tx-price").dataset.touched){ const qh=S.quotes[chosen.id]; const v=qh&&qh.hist?makeLookup(qh.hist)($("#tx-date").value):null; if(v>0){ $("#tx-price").value=String(+v.toPrecision(6)).replace(".",","); } }
    const q=parseNum($("#tx-qty").value), pr=parseNum($("#tx-price").value), fee=parseNum($("#tx-fee").value)||0, tax=parseNum($("#tx-tax").value)||0, am=parseNum($("#tx-amount").value), fq=parseNum($("#tx-feeq").value)||0;
    let total=NaN;
    if(type==="buy")total=q*pr+fee+tax; else if(type==="sell")total=q*pr-fee-tax; else if(isSt)total=q*(pr||0)-fee-tax; else if(!isTr) total=am-fee-tax;
    $("#tx-tax-h").textContent=type==="interest"?"Kapitalertragsteuer, Soli, Kirchensteuer":type==="dividend"?"Quellensteuer, Kapitalertragsteuer, Soli":type==="buy"?"meist 0, z. B. Finanztransaktionssteuer":"Kapitalertragsteuer, Soli, Kirchensteuer";
    $("#tx-sum-l").textContent=type==="buy"?"Gesamtkosten inkl. Gebühren und Steuern":type==="sell"?"Erlös nach Gebühren und Steuern":type==="interest"?"Zinsen netto nach Steuern":isSt?"Wert der Rewards bei Erhalt":isTr?"Kommt an":"Dividende netto nach Steuern";
    $("#tx-sum").textContent=isTr?(q>0?nfQ.format(+Math.max(0,q-fq).toFixed(10))+" Stück":"–"):isFinite(total)?eur(total):"–";
  };
  d.querySelectorAll("#tx-type button").forEach(b=>b.onclick=()=>{type=b.dataset.t;sync();});
  $("#tx-form").addEventListener("input",e=>{ if(e.target.id==="tx-price")e.target.dataset.touched="1"; if(e.target.id==="tx-date"&&type==="staking"&&!$("#tx-price").dataset.touched)$("#tx-price").value=""; sync(); });
  showChosen(); sync();
  if(chosen) setTimeout(()=>$("#tx-qty").focus(),30);
  const save=async()=>{
    const err=$("#tx-err"); err.textContent="";
    const date=$("#tx-date").value;
    const q=parseNum($("#tx-qty").value), pr=parseNum($("#tx-price").value), fee=parseNum($("#tx-fee").value)||0, tax=parseNum($("#tx-tax").value)||0, am=parseNum($("#tx-amount").value);
    const isInt=type==="interest";
    if(!chosen&&!isInt)return err.textContent="Bitte zuerst ein Asset suchen und auswählen.";
    if(!date)return err.textContent="Bitte ein Datum wählen.";
    if(date<"1990-01-01"||date>localToday())return err.textContent=`Das Datum ${fmtDate(date)} wirkt falsch. Bitte Jahr prüfen.`;
    const fq=parseNum($("#tx-feeq").value)||0, toB=$("#tx-to").value.trim(), fromB=$("#tx-broker").value.trim();
    if(type==="buy"||type==="sell"){ if(!(q>0))return err.textContent="Stückzahl muss größer als 0 sein."; if(!(pr>0))return err.textContent="Kurs je Stück muss größer als 0 sein."; }
    else if(type==="staking"){ if(!(q>0))return err.textContent="Bitte die erhaltene Stückzahl eintragen."; if(pr<0)return err.textContent="Der Wert je Stück kann nicht negativ sein."; }
    else if(type==="transfer"){
      if(!(q>0))return err.textContent="Bitte die gesendete Stückzahl eintragen.";
      if(fq<0||fq>=q)return err.textContent="Die Netzwerkgebühr muss kleiner sein als die gesendete Menge.";
      if(!fromB||!toB)return err.textContent="Bitte eintragen, von wo nach wo du überträgst.";
      if(fromB===toB)return err.textContent="Start und Ziel sind gleich.";
      if(!chosen.existing)return err.textContent="Für dieses Asset gibt es noch keinen Bestand.";
      const held=heldAt(chosen.id,date,tx&&tx.id,fromB); if(q>held+1e-9)return err.textContent=`Am ${fmtDate(date)} liegen bei ${fromB} nur ${nfQ.format(held)} Stück.`;
    }
    else if(!(am>0))return err.textContent=isInt?"Bitte den Zinsbetrag eintragen.":"Bitte den Dividendenbetrag eintragen.";
    if(fee<0)return err.textContent="Gebühren können nicht negativ sein.";
    if(tax<0)return err.textContent="Steuern können nicht negativ sein. Eine Steuererstattung trägst du als Dividende ein.";
    if(type==="sell"&&!chosen.existing)return err.textContent="Für dieses Asset gibt es noch keinen Kauf.";
    if(type==="sell"){ const held=heldAt(chosen.id,date,tx&&tx.id); if(q>held+1e-9)return err.textContent=`Am ${fmtDate(date)} hältst du nur ${nfQ.format(held)} Stück.`; }
    let newAsset=null;
    if(!isInt&&!chosen.existing){
      const tick=$("#tx-tick").value.trim(), name=$("#tx-name").value.trim();
      if(!tick)return err.textContent="Bitte einen Ticker eintragen.";
      if(!name)return err.textContent="Bitte einen Namen eintragen.";
      const r=chosen.r||{}; const typed=(chosen.text||"").toUpperCase();
      newAsset={ticker:tick,name,cls:$("#tx-cls").value,isin:r.isin||(ISIN_RE.test(typed)?typed:""),ovType:r.ovType||"",ovId:r.ovId||"",notation:r.notation||"",exchLabel:r.exchLabel||"",currency:r.currency||""};
    }
    const body={assetId:isInt?null:(chosen.existing?chosen.id:null),newAsset:isInt?null:newAsset,tx:{id:tx?tx.id:undefined,createdAt:tx?tx.createdAt:undefined,date,type,qty:q,price:type==="transfer"?0:(pr||0),fee,tax:type==="transfer"?0:tax,amount:am,feeQty:type==="transfer"?fq:0,toBroker:type==="transfer"?toB:"",broker:fromB,note:$("#tx-note").value.trim()}};
    const btn=$("#tx-save"); btn.disabled=true; btn.textContent="Speichert …";
    try{
      const r=await api("POST","/api/tx",body);
      closeModal(); toast(r.fetching?"Gespeichert. Kursverlauf wird geladen …":(edit?"Transaktion aktualisiert":"Transaktion gespeichert")); await load(); if(r.fetching)setTimeout(poll,800);
    }catch(e){ btn.disabled=false; btn.textContent=edit?"Änderungen speichern":"Speichern"; err.textContent=apiMsg(e); }
  };
  $("#tx-save").onclick=save;
  $("#tx-form").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.id!=="pk-q"&&!e.target.list){ e.preventDefault(); save(); } });
}
function heldAt(sym,date,excludeId,broker){
  let h=0; S.tx.filter(t=>t.symbol===sym&&t.id!==excludeId&&t.date<=date).forEach(t=>{ const q=+t.qty||0, at=broker==null||t.broker===broker;
    if(t.type==="buy"||t.type==="staking"){ if(at)h+=q; } else if(t.type==="sell"){ if(at)h-=q; }
    else if(t.type==="transfer"){ if(broker==null)h-=Math.min(+t.feeQty||0,q); else { if(t.broker===broker)h-=q; if(t.toBroker===broker)h+=q-(+t.feeQty||0); } } }); return Math.max(0,h);
}
async function deleteTx(id){
  try{ await api("DELETE","/api/tx/"+encodeURIComponent(id)); toast("Transaktion gelöscht"); await load(); }catch(e){ toast(apiMsg(e)); }
}

      <tbody>${txs.map(t=>`<tr><td class="num">${fmtDate(t.date)}</td><td><span class="type ${t.type}">${TYPE[t.type]}</span></td><td class="r num">${t.type==="dividend"?"–":nfQ.format(+t.qty)}</td><td class="r num">${t.type==="dividend"||t.type==="transfer"?"–":priceFmt(+t.price)}</td><td class="r num">${t.type==="transfer"?(+t.feeQty?"−"+nfQ.format(+t.feeQty)+" Stk.":"–"):eur(txAmount(t))}</td><td>${t.type==="transfer"?esc((t.broker||"–")+" → "+(t.toBroker||"–")):esc(t.broker||"–")}</td><td><button class="btn ghost small edit-only" type="button" data-edit="${esc(t.id)}">Bearbeiten</button></td></tr>`).join("")}</tbody></table></div>

      const c=document.createElement("canvas"); c.width=c.height=128; const x=c.getContext("2d");
